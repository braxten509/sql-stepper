<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SQL Stepper</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%238b9dff%22/%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%23c084fc%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%228%22%20fill%3D%22url%28%23g%29%22/%3E%3Cg%20transform%3D%22translate%284%204%29%22%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%222.6%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M5%204l10%208-10%208%22/%3E%3Cpath%20d%3D%22M19%205v14%22/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d0f14; --panel: #13161d; --panel-2: #191d26; --line: #242a36; --line-2: #2f3746;
  --text: #e7eaf0; --muted: #8a93a6; --faint: #5b6476;
  --accent: #8b9dff; --accent-bg: rgba(139,157,255,.13);
  --green: #4ade80; --green-bg: rgba(74,222,128,.12);
  --red: #f87171; --red-bg: rgba(248,113,113,.11);
  --amber: #fbbf24; --amber-bg: rgba(251,191,36,.14);
  --blue: #60a5fa; --blue-bg: rgba(96,165,250,.15);
  --kw: #c4a7ff; --str: #86efac; --num: #fdba74; --fn: #7dd3fc; --cmt: #5b6476;
  --shadow: 0 8px 24px rgba(0,0,0,.25);
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --sans: "Inter", system-ui, sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #f6f7f9; --panel: #fff; --panel-2: #f3f4f7; --line: #e4e7ec; --line-2: #d5dae2;
    --text: #151922; --muted: #5d6677; --faint: #98a1b1;
    --accent: #4f5fe8; --accent-bg: rgba(79,95,232,.09);
    --green: #15803d; --green-bg: rgba(34,197,94,.14);
    --red: #dc2626; --red-bg: rgba(239,68,68,.10);
    --amber: #b45309; --amber-bg: rgba(245,158,11,.16);
    --blue: #2563eb; --blue-bg: rgba(59,130,246,.12);
    --kw: #7c3aed; --str: #15803d; --num: #c2410c; --fn: #0369a1; --cmt: #98a1b1;
    --shadow: 0 1px 2px rgba(16,24,40,.05), 0 6px 18px rgba(16,24,40,.05);
    color-scheme: light;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.55 var(--sans); -webkit-font-smoothing: antialiased; }
/* JetBrains Mono merges >= into one symbol; keep the real characters (the `font` shorthand elsewhere would reset this) */
* { font-variant-ligatures: none !important; font-feature-settings: "calt" 0, "liga" 0 !important; }
button { font: inherit; color: inherit; }
.k { color: var(--kw); font-weight: 500; } .s { color: var(--str); } .n { color: var(--num); } .f { color: var(--fn); } .c { color: var(--cmt); font-style: italic; }
mark.hl { background: var(--accent-bg); color: inherit; border-radius: 4px; box-shadow: 0 0 0 1.5px color-mix(in srgb, var(--accent) 55%, transparent); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 34px; min-width: 34px; padding: 0 12px; border-radius: 9px; border: 1px solid var(--line-2); background: var(--panel); cursor: pointer; font-weight: 500; }
.btn:hover:not(:disabled) { border-color: var(--faint); }
.btn:disabled { opacity: .4; cursor: default; }
.btn.primary { background: var(--accent); color: #fff; border-color: transparent; }
.btn:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.null { color: var(--faint); font-style: italic; }
.mono { font-family: var(--mono); }
.doc { max-width: 1080px; margin: 0 auto; display: grid; gap: 16px; align-content: start; }

/* numbered badges */
.badge { display: inline-grid; place-items: center; min-width: 24px; height: 24px; padding: 0 6px; border-radius: 99px; font: 700 11.5px var(--mono); border: 1.5px solid var(--line-2); color: var(--muted); background: var(--panel); cursor: pointer; transition: transform .12s, background .12s; }
.badge:hover { transform: scale(1.1); }
.badge.done { border-color: color-mix(in srgb, var(--accent) 55%, transparent); color: var(--accent); }
.badge.on { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 0 0 4px var(--accent-bg); }
.badge[data-kind=change] { border-style: dashed; }
.badge[data-kind=error] { border-color: var(--red); color: var(--red); }
.badge.on[data-kind=error] { background: var(--red); color: #fff; box-shadow: 0 0 0 4px var(--red-bg); }

/* ---------- the code, pinned on top ---------- */
.card { border: 1px solid var(--line); border-radius: 14px; background: var(--panel); box-shadow: var(--shadow); }
.codebox { position: sticky; top: 64px; z-index: 5; max-height: 38vh; overflow: auto; padding: 8px 0; }
.cb-start { display: flex; align-items: center; gap: 10px; padding: 4px 16px 6px 36px; font-size: 12.5px; font-weight: 600; color: var(--muted); }
.stmt + .stmt, .cb-start + .stmt { border-top: 1px dashed var(--line); padding-top: 6px; margin-top: 4px; }
.line { display: grid; grid-template-columns: 84px 1fr;  /* room for two bubbles like 3 and 10 */ align-items: start; min-height: 28px; }
.gut { display: flex; gap: 4px; justify-content: flex-end; padding: 2px 12px 0 8px; flex-wrap: wrap; }
.src { font: 14px/28px var(--mono); white-space: pre-wrap; word-break: break-word; padding-right: 16px; }
.line.dim .src { opacity: .4; }
mark.hl { color: inherit; border-radius: 2px; box-shadow: none; background: color-mix(in srgb, var(--accent) 16%, transparent); }
u.focus { text-decoration: none; background: color-mix(in srgb, var(--amber) 22%, transparent); box-shadow: inset 0 -2px var(--amber); border-radius: 3px; }

/* ---------- the stage: what this part does, then the one board every table lives on ---------- */
.stage-head { display: grid; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); overflow: clip; }
.stage[data-kind=error] .stage-head { background: var(--red-bg); }
.stage[data-kind=error] .p-title { color: var(--red); }
.p-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.p-title { font: 700 14px var(--mono); color: var(--accent); }
.p-scope { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--panel-2); border: 1px solid var(--line); color: var(--muted); }
.p-flow { margin-left: auto; font: 600 12px var(--mono); color: var(--muted); }
.p-flow b { color: var(--text); }
.p-explain { font-size: 14.5px; line-height: 1.6; }
.gkey { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; font: 13px var(--mono); color: var(--text); }
.gkey b { color: var(--muted); font-weight: 600; margin-right: 2px; }
.gkey em { font-style: normal; color: var(--muted); margin-left: 6px; }
.gkey em::before { content: "= "; color: var(--faint); }
.gkey i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 7px; vertical-align: -1px; }
.sub { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.sub .btn { height: 30px; min-width: 30px; padding: 0 9px; }
.sub .label { font-weight: 600; font-size: 13px; }
.sub .label small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.sub .dots { display: flex; gap: 4px; flex-wrap: wrap; margin-left: auto; max-width: 50%; }
.sub .dots button { width: 9px; height: 9px; border-radius: 50%; border: 0; padding: 0; cursor: pointer; background: var(--line-2); }
.sub .dots button.done { background: color-mix(in srgb, var(--accent) 50%, var(--line-2)); }
.sub .dots button.on { background: var(--accent); transform: scale(1.35); }
.sub .dots button.end { border-radius: 3px; }
.focus-card { padding: 12px 14px; border-radius: 12px; background: var(--panel-2); border: 1px solid var(--line-2); display: grid; gap: 8px; }
.chk { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font: 14px var(--mono); }
.chk .expr { color: var(--muted); min-width: 0; }
.val { display: inline-block; padding: 1px 8px; border-radius: 6px; background: var(--panel); border: 1px solid var(--line-2); font-weight: 600; }
.arrow-r { color: var(--faint); }
.t-yes { color: var(--green); font-weight: 700; } .t-no { color: var(--red); font-weight: 700; } .t-null { color: var(--amber); font-weight: 700; }
.verdict { font: 600 14px var(--sans); padding-top: 4px; border-top: 1px dashed var(--line-2); }
.verdict:first-child { border-top: 0; padding-top: 0; }
.verdict.yes { color: var(--green); } .verdict.no { color: var(--red); }
.whens { display: grid; grid-template-columns: auto auto auto 1fr; gap: 6px 14px; align-items: center; font: 14px var(--mono); }
.when { display: contents; }
.when .wm { font-weight: 700; color: var(--red); text-align: center; }
.when.win .wm, .when.win .mono { color: var(--green); font-weight: 700; }
.when.skip > * { color: var(--faint); }

.board-wrap { overflow-x: auto; padding: 18px; }
#board { position: relative; transition: height .6s cubic-bezier(.45, 0, .25, 1); }
/* every box, header, cell and outline is its own piece, placed by position, so it can glide to its next spot */
.it { position: absolute; left: 0; top: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.box { z-index: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
.bt { display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px; font-size: 12px; color: var(--muted); }
.bt b { font: 600 13px var(--mono); color: var(--text); overflow: hidden; text-overflow: ellipsis; }
.bt span { margin-left: auto; flex: none; }
.more { position: absolute; bottom: 6px; left: 14px; font-size: 12px; color: var(--muted); }
.th { z-index: 1; padding: 0 14px; font: 600 12px/34px var(--mono); color: var(--muted); background: var(--panel-2); border-bottom: 1px solid var(--line); }
.th.rn { padding: 0 10px 0 0; text-align: right; }
/* tints are all color-mix(): blending between these and plain rgba() colors glitches in Chrome */
.td { z-index: 2; padding: 0 14px; font: 13px/34px var(--mono); border-bottom: 1px solid var(--line);
  background-color: color-mix(in srgb, var(--gc, transparent) 10%, transparent); }
.td.last { border-bottom-color: transparent; }
.td.rn { color: var(--faint); text-align: right; padding: 0 10px 0 0; box-shadow: inset 3px 0 var(--gc, transparent); }
.td.empty { color: var(--faint); }
.td.ch { background-color: color-mix(in srgb, var(--amber) 16%, transparent); }
.td.ch s { color: var(--muted); margin-right: 6px; }
.td.ck { text-align: center; padding: 0; font-weight: 700; color: var(--faint); }
.td.ck-yes { color: var(--green); } .td.ck-no { color: var(--red); }
.td.r-no:not(.ck):not(.rn) { color: var(--red); text-decoration: line-through; }
.td.r-skip:not(.ck):not(.rn) { color: var(--faint); }
.td.r-rem { color: var(--red); text-decoration: line-through; background-color: color-mix(in srgb, var(--red) 11%, transparent); }
.td.r-add { background-color: color-mix(in srgb, var(--green) 13%, transparent); }
.td.r-add.rn { box-shadow: inset 3px 0 var(--green); }
.td.r-chg.rn { box-shadow: inset 3px 0 var(--amber); }
.td.r-match { background-color: color-mix(in srgb, var(--blue) 13%, transparent); }
.pill { display: inline-block; margin: 0 -7px; padding: 0 7px; line-height: 24px; border-radius: 6px; font-weight: 700; color: var(--text);
  background: color-mix(in srgb, var(--amber) 22%, transparent); box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--amber) 70%, transparent); }
.ring { z-index: 3; pointer-events: none; border-radius: 8px; border: 2px solid color-mix(in srgb, var(--blue) 80%, transparent); }
.ring.col { border-color: color-mix(in srgb, var(--accent) 75%, transparent); border-radius: 7px; }
.ring.col.out { border-style: dashed; }
.more { all: unset; margin-left: 7px; color: var(--faint); font: italic 11px var(--mono); cursor: pointer; }
.more:hover, .more:focus-visible { color: var(--text); text-decoration: underline; }
#hid { max-width: min(92vw, 900px); max-height: 80vh; padding: 0; border: 1px solid var(--line-2); border-radius: 12px; background: var(--panel); color: var(--text); }
#hid::backdrop { background: rgba(0, 0, 0, .45); }
.hid-head { position: sticky; top: 0; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
.hid-head .expr { color: var(--muted); font: 12px var(--mono); margin-left: 8px; }
table.hid { border-collapse: collapse; font: 13px var(--mono); margin: 8px 8px 12px; }
table.hid th { color: var(--muted); font-weight: 600; text-align: left; }
table.hid th, table.hid td { padding: 7px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.hid .rn { color: var(--faint); }
.hid-wrap { position: relative; }
.ring.frame { border: 2px dashed color-mix(in srgb, var(--amber) 85%, transparent); }  /* the rows a window function reads */
.calc .chk + .chk { margin-top: 6px; }
.gone { opacity: .45; text-decoration: line-through; }
.calc.sub { margin: 4px 0 6px 22px; padding-left: 12px; border-left: 2px solid var(--line); font-size: 13px; }
.ring.col.out, .ring.col.pick { border-color: color-mix(in srgb, var(--green) 85%, transparent); }  /* green: going into the result */
/* a quick glow on a value that just arrived or changed (an overlay, so it never fights the row's own tint) */
.flash::after { content: ""; position: absolute; inset: 0; background: color-mix(in srgb, var(--amber) 22%, transparent); animation: flash 1.1s ease-out var(--fd, 0s) both; pointer-events: none; }
@keyframes flash { to { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { #board { transition: none; } .flash::after { animation: none; opacity: 0; } }

/* dock */
.dock { display: flex; align-items: center; gap: 10px; min-width: 0; }
.dock .btn { width: 108px; flex: none; }
.dock #end { width: auto; }
.dock[hidden] { display: none; }
.dock .label { font-size: 13px; color: var(--muted); min-width: 110px; max-width: 440px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 800px) { .line { grid-template-columns: 56px 1fr; } .sub .dots { display: none; } }

/* ---------- app layout: editors on the left, the stepper on the right; the page itself scrolls ---------- */
/* brand | part controls (centered) | Run */
header { position: sticky; top: 0; z-index: 10; height: 52px; display: grid; grid-template-columns: minmax(max-content, 1fr) minmax(0, auto) minmax(max-content, 1fr); align-items: center; gap: 12px; padding: 0 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
.brand { white-space: nowrap; display: flex; align-items: center; gap: 10px; font-weight: 650; letter-spacing: -.01em; }
.logo { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; background: linear-gradient(135deg, var(--accent), #c084fc); color: #fff; }
.brand small { margin-left: 8px; font-weight: 500; color: var(--muted); }
.actions { grid-column: 3; justify-self: end; display: flex; gap: 8px; }
#ask.on { border-color: var(--accent); color: var(--accent); background: var(--accent-bg); }
.spin { width: 14px; height: 14px; border: 2px solid rgba(255,255,255,.35); border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
main { display: grid; grid-template-columns: minmax(300px, 30%) 1fr; align-items: start; }
.side { position: sticky; top: 52px; height: calc(100vh - 52px); display: flex; flex-direction: column; gap: 12px; padding: 14px 16px 16px; border-right: 1px solid var(--line); }
.view { min-width: 0; padding: 12px 24px 40px; }

/* ---------- editors ---------- */
/* open boxes share the height: schema 4, instructions 3, code 5; a folded box is just its label */
.ed-wrap { display: flex; flex-direction: column; min-height: 110px; flex: 4 1 0; }
.ed-wrap.notes { flex-grow: 3; }
.ed-wrap.main { flex-grow: 5; }
.ed-wrap.closed { flex: 0 0 auto; min-height: 0; }
.ed-wrap.closed .editor { display: none; }
.ed-label { font-size: 12px; font-weight: 600; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
.ed-label span { margin-left: auto; color: var(--muted); font-weight: 400; }
button.ed-label { width: 100%; padding: 0; border: 0; background: none; color: inherit; font-family: inherit; cursor: pointer; text-align: left; }
.ed-wrap.closed .ed-label { margin-bottom: 0; }
button.ed-label::before { content: ""; width: 6px; height: 6px; margin: 0 2px 0 1px; border: solid var(--muted); border-width: 0 1.5px 1.5px 0; transform: rotate(45deg) translate(-2px, -1px); transition: transform .15s; }
.ed-wrap.closed button.ed-label::before { transform: rotate(-45deg); }
button.ed-label:hover::before { border-color: var(--text); }
button.ed-label:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.editor.plain textarea { color: var(--text); font: 13px/1.55 var(--sans); white-space: pre-wrap; }
.editor { position: relative; flex: 1; min-height: 0; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); overflow: hidden; transition: border-color .15s; }
.editor:focus-within { border-color: var(--accent); }
.editor pre, .editor textarea { position: absolute; inset: 0; margin: 0; padding: 12px 14px; font: 13px/1.6 var(--mono); white-space: pre-wrap; word-wrap: break-word; overflow: auto; tab-size: 2; }
.editor pre { pointer-events: none; color: var(--text); }
.editor textarea { resize: none; border: 0; outline: none; background: transparent; color: transparent; caret-color: var(--text); }
.editor textarea::selection { background: var(--accent-bg); color: transparent; }
.editor textarea::placeholder { color: var(--faint); }
textarea:focus-visible { outline: none; }

.doc-empty { min-height: 60vh; display: grid; place-items: center; text-align: center; color: var(--muted); padding: 24px; }
.doc-empty .big { font-size: 16px; color: var(--text); font-weight: 600; margin: 12px 0 4px; }
.error-box { max-width: 760px; margin: 40px auto; padding: 16px 18px; border-radius: 12px; border: 1px solid color-mix(in srgb, var(--red) 45%, transparent); background: var(--red-bg); }
@media (max-width: 1000px) {
  main { grid-template-columns: 1fr; }
  .side { position: static; height: 560px; border-right: 0; border-bottom: 1px solid var(--line); }
  .view { padding: 12px; }
  .dock .label { min-width: 0; flex: 1; }
  .brand small { display: none; }
}
@media (max-width: 640px) {
  .brand-name, .dock .label { display: none; }
  .board-wrap { padding: 12px; }
}
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } }

/* ---------- AI helper: a chat panel on the right that sees what's on screen ---------- */
#chat { position: fixed; top: 52px; right: 0; bottom: 0; width: 400px; z-index: 9; display: flex; flex-direction: column; background: var(--panel); border-left: 1px solid var(--line); }
#chat[hidden] { display: none; }
body.chatting main { margin-right: 400px; }
.chat-head { display: flex; align-items: center; gap: 10px; padding: 10px 12px 10px 16px; border-bottom: 1px solid var(--line); }
.chat-head span { flex: 1; font-size: 11.5px; line-height: 1.35; color: var(--muted); }
#msgs { flex: 1; overflow: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.msg { font-size: 13.5px; line-height: 1.55; overflow-wrap: anywhere; }
.msg.user { align-self: flex-end; max-width: 85%; padding: 8px 12px; border-radius: 12px 12px 4px 12px; background: var(--accent-bg); white-space: pre-wrap; }
.msg.ai p { margin: 0 0 6px; }
.msg.ai ul, .msg.ai ol { margin: 0 0 6px; padding-left: 20px; }
.msg.ai code { font: 12.5px var(--mono); padding: 1px 5px; border-radius: 4px; background: var(--panel-2); }
.msg.ai pre { margin: 4px 0 8px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel-2); overflow: auto; font: 12.5px/1.55 var(--mono); }
.msg.ai pre code { padding: 0; background: none; }
.msg.ai table { margin: 4px 0 8px; border-collapse: collapse; font: 12.5px var(--mono); display: block; overflow-x: auto; }
.msg.ai th, .msg.ai td { padding: 4px 10px; border: 1px solid var(--line); text-align: left; white-space: nowrap; }
.msg.ai th { background: var(--panel-2); font-weight: 600; }
.msg.err { color: var(--red); }
.msg.typing > :last-child::after, .msg.typing:empty::after { content: "▍"; margin-left: 2px; color: var(--accent); animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.starters { margin-top: auto; display: flex; flex-direction: column; gap: 8px; }
.starters p { margin: 0 0 4px; color: var(--muted); font-size: 13px; }
.starters .btn { justify-content: flex-start; height: auto; padding: 8px 12px; text-align: left; }
#chat-form { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--line); }
#ask-in { flex: 1; resize: none; max-height: 140px; padding: 8px 10px; border: 1px solid var(--line-2); border-radius: 10px; background: var(--panel-2); color: var(--text); font: 13.5px/1.45 var(--sans); }
#ask-in:focus { outline: none; border-color: var(--accent); }
@media (max-width: 1000px) { #chat { width: 100%; } body.chatting main { margin-right: 0; } }
@media (prefers-reduced-motion: reduce) { .msg.typing > :last-child::after { animation: none; } }
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4l10 8-10 8"/><path d="M19 5v14"/></svg></div>
    <span class="brand-name">SQL Stepper <small>MySQL 8.0</small></span>
  </div>
  <div class="dock" hidden>
    <button class="btn" id="prev" aria-label="Previous part">‹ Back</button>
    <div class="label" id="label"></div>
    <button class="btn primary" id="next" aria-label="Next part">Next part ›</button>
    <button class="btn" id="end" aria-label="Skip to the end">Skip to end »</button>
  </div>
  <div class="actions">
    <button class="btn" id="ask" hidden aria-label="Ask AI about your SQL"><svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.4 7.6L22 12l-7.6 2.4L12 22l-2.4-7.6L2 12l7.6-2.4z"/></svg><span>Ask AI</span></button>
    <button class="btn primary" id="run" title="Run (Ctrl+Enter)"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4l14 8-14 8z"/></svg><span>Run</span></button>
  </div>
</header>
<main>
  <section class="side">
    <div class="ed-wrap" data-fold="setup">
      <button class="ed-label" aria-expanded="true">Schema <span>starting tables and data</span></button>
      <div class="editor"><pre aria-hidden="true"></pre><textarea id="setup" spellcheck="false" aria-label="Schema SQL" placeholder="CREATE TABLE ... / INSERT INTO ..."></textarea></div>
    </div>
    <div class="ed-wrap notes closed" data-fold="notes">
      <button class="ed-label" aria-expanded="false">Instructions <span id="notes-sub">the problem, optional</span></button>
      <div class="editor plain"><textarea id="notes" spellcheck="true" aria-label="Instructions" placeholder="Paste the problem description here (optional). The AI helper reads it too."></textarea></div>
    </div>
    <div class="ed-wrap main">
      <div class="ed-label">Your code <span>what to step through</span></div>
      <div class="editor"><pre aria-hidden="true"></pre><textarea id="code" spellcheck="false" aria-label="Your SQL" placeholder="SELECT ... / UPDATE ... / DELETE ..."></textarea></div>
    </div>
  </section>
  <section class="view">
    <div class="doc" id="doc"><div class="doc-empty"><div><div class="big">Paste some SQL and press Run</div><div>You'll step through it in the order MySQL actually runs it.</div></div></div></div>
  </section>
</main>

<aside id="chat" hidden aria-label="AI helper">
  <div class="chat-head"><b>AI helper</b><span id="chat-note"></span><button class="btn" id="chat-x" aria-label="Close the AI helper">✕</button></div>
  <div id="msgs" aria-live="polite"></div>
  <form id="chat-form"><textarea id="ask-in" rows="2" placeholder="Ask about your SQL..." aria-label="Your question"></textarea><button class="btn primary" id="send" aria-label="Send">↑</button></form>
</aside>
<dialog id="hid" aria-labelledby="hid-title"><div class="hid-head"><b id="hid-title"></b><button class="btn" id="hid-x" aria-label="Close">✕</button></div><div id="hid-body"></div></dialog>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const GC = ["#8b9dff", "#f472b6", "#34d399", "#fbbf24", "#60a5fa", "#fb7185", "#a78bfa", "#2dd4bf"];
const cellHtml = v => v === null ? `<span class="null">NULL</span>` : esc(v);
const liveRows = t => t ? t.rows.filter(r => !["dropped", "removed"].includes(r.m)).length + t.more : 0;
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;

// ---------- SQL syntax highlighting ----------
const KW = new Set(("select from where group by having order limit offset join inner left right outer cross full on using as and or not " +
  "in is null like between case when then else end distinct union all intersect except with recursive insert into values update set " +
  "delete create table if exists drop alter add column primary key foreign references truncate asc desc over partition rows range " +
  "unbounded preceding following current row int integer varchar char text date datetime decimal float double bigint boolean default " +
  "unique index view replace ignore true false interval enum auto_increment constraint check").split(" "));
function highlight(src) {
  const re = /(--[^\n]*|#[^\n]*|\/\*[\s\S]*?\*\/)|('(?:[^'\\]|\\.|'')*'?|"(?:[^"\\]|\\.)*"?|`[^`]*`?)|(\b\d+(?:\.\d+)?\b)|([A-Za-z_][A-Za-z0-9_]*)(?=\s*\()|([A-Za-z_][A-Za-z0-9_]*)/g;
  let out = "", last = 0, m;
  while ((m = re.exec(src))) {
    out += esc(src.slice(last, m.index));
    const t = esc(m[0]);
    if (m[1]) out += `<span class="c">${t}</span>`;
    else if (m[2]) out += `<span class="s">${t}</span>`;
    else if (m[3]) out += `<span class="n">${t}</span>`;
    else if (m[4]) out += KW.has(m[4].toLowerCase()) ? `<span class="k">${t}</span>` : `<span class="f">${t}</span>`;
    else out += KW.has(m[5].toLowerCase()) ? `<span class="k">${t}</span>` : t;
    last = re.lastIndex;
  }
  return out + esc(src.slice(last));
}

// Find the step's clause inside the original statement, tolerating spacing, case and an added "AS".
// Main-query steps prefer a match outside parentheses; nested steps prefer one inside.
function locate(text, title, nested) {
  const toks = title.match(/[A-Za-z0-9_$.]+|'[^']*'|`[^`]*`|[^\sA-Za-z0-9_]/g);
  if (!toks || toks.length > 40) return null;
  const pat = toks.map(t => /^as$/i.test(t) ? "(?:AS\\s+)?" : t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&").replace(/^`(.*)`$/, "`?$1`?"))
    .join("\\s*");
  let re;
  try { re = new RegExp(pat, "gi"); } catch { return null; }
  const found = [...text.matchAll(re)].map(m => [m.index, m.index + m[0].length]);
  const depthAt = i => { let d = 0; for (const c of text.slice(0, i)) d += c === "(" ? 1 : c === ")" ? -1 : 0; return d; };
  return found.find(([a]) => (depthAt(a) > 0) === nested) || found[0] || null;
}

// ---------- editors ----------
const DEFAULT_SETUP = `Create table If Not Exists Tree (id int, p_id int)
Truncate table Tree
insert into Tree (id, p_id) values ('1', NULL)
insert into Tree (id, p_id) values ('2', '1')
insert into Tree (id, p_id) values ('3', '1')
insert into Tree (id, p_id) values ('4', '2')
insert into Tree (id, p_id) values ('5', '2')`;
const DEFAULT_CODE = `SELECT id,
  CASE
    WHEN p_id IS NULL THEN 'Root'
    WHEN id IN (SELECT p_id FROM Tree) THEN 'Inner'
    ELSE 'Leaf'
  END AS type
FROM Tree
ORDER BY id;`;
function store(k, v) { try { v === undefined ? (v = localStorage.getItem(k)) : localStorage.setItem(k, v); } catch { v = null; } return v; }
// Schema and Instructions fold open and shut (remembered); Instructions starts folded
for (const w of document.querySelectorAll("[data-fold]")) {
  const k = "sqlstepper.open." + w.dataset.fold, b = w.querySelector(".ed-label");
  const set = open => { w.classList.toggle("closed", !open); b.setAttribute("aria-expanded", open); store(k, open ? "1" : "0"); };
  set((store(k) ?? (w.dataset.fold === "setup" ? "1" : "0")) === "1");
  b.onclick = () => { set(w.classList.contains("closed")); if (!w.classList.contains("closed")) w.querySelector("textarea").focus(); };
}
{
  const ta = $("#notes"), sub = () => $("#notes-sub").textContent = ta.value.trim() ? "added" : "the problem, optional";
  ta.value = store("sqlstepper.notes") ?? "";
  ta.addEventListener("input", () => { store("sqlstepper.notes", ta.value); sub(); });
  sub();
}
for (const [id, def] of [["setup", DEFAULT_SETUP], ["code", DEFAULT_CODE]]) {
  const ta = $("#" + id), pre = ta.previousElementSibling;
  const paint = () => { pre.innerHTML = highlight(ta.value) + "\n"; pre.scrollTop = ta.scrollTop; };
  ta.value = store("sqlstepper." + id) ?? def;
  ta.addEventListener("input", () => { paint(); store("sqlstepper." + id, ta.value); });
  ta.addEventListener("scroll", () => { pre.scrollTop = ta.scrollTop; });
  ta.addEventListener("keydown", e => {
    if (e.key === "Tab" && !e.shiftKey && !e.ctrlKey) { e.preventDefault(); document.execCommand("insertText", false, "  "); }
  });
  paint();
}

// ---------- helpers ----------
const STOP = /^(FROM|WHERE|GROUP\s+BY|HAVING|ORDER\s+BY|LIMIT|UNION|SET|(?:LEFT|RIGHT|INNER|CROSS)\s+JOIN|JOIN)\b/i;
function clauseEnd(text, start) {  // a clause runs to the next top-level clause keyword or its closing paren
  const own = STOP.exec(text.slice(start)) || /^\w+/.exec(text.slice(start));
  let d = 0;
  for (let i = start + (own ? own[0].length : 1); i < text.length; i++) {
    const c = text[i];
    if (c === "(") d++;
    else if (c === ")") { if (--d < 0) return i; }
    else if (!d && /\s/.test(text[i - 1]) && STOP.test(text.slice(i))) return text.slice(0, i).trimEnd().length;
  }
  return text.replace(/[;\s]+$/, "").length;
}
const lineOf = (text, i) => text.slice(0, i).split("\n").length - 1;
const v = x => x === null || x === undefined ? `<span class="val null">NULL</span>` : `<span class="val">${esc(x)}</span>`;
const truth = t => t === null || t === undefined ? `<span class="t-null">NULL ✗</span>`
  : +t ? `<span class="t-yes">true ✓</span>` : `<span class="t-no">false ✗</span>`;
const short = (r, n = 3) => r.v.slice(0, n).map(x => x === null ? "NULL" : x).join(", ");


// ---------- main steps (consecutive row-by-row steps become one "SET" part with inner steps) ----------
let SC = null, MAIN = [];
function build(data) {
  SC = data; MAIN = [];
  data.steps.forEach((s, i) => {
  const last = MAIN[MAIN.length - 1];
  if (s.kind === "row" && last && last.rows) { last.rows.push(s); return; }
  if (s.kind === "row") {
    const text = SC.statements[s.stmt].text, at = locate(text, "SET", false);
    const title = at ? text.slice(at[0], clauseEnd(text, at[0])).replace(/\s+/g, " ") : "Remove the matched rows";
    MAIN.push({ ...s, title, rows: [s], explain: at ? "Now MySQL applies SET to each matched row, one at a time. Rows that didn't match are left alone."
      : "Now MySQL removes each matched row, one at a time.", src: i });
    return;
  }
  MAIN.push({ ...s, src: i });
  });
}
// The step feeding this one: the previous part of the same statement and scope that has a table.
function feeder(k) {
  for (let j = k - 1; j >= 0; j--) {
    const p = MAIN[j];
    if (p.stmt !== MAIN[k].stmt) return null;
    if (p.scope === MAIN[k].scope && p.tables.length && p.kind !== "note") return p;
  }
  return null;
}
const keptRows = s => { const t = s.tables[0]; return t.rows.filter(r => !["dropped", "removed"].includes(r.m)); };

// The actual values each check compared (same layout checkLines reads: truth, then left, then right).
function checkVals(d, raw) {
  let i = 0; const out = new Set();
  d.checks.forEach(c => { i++; if ("left" in c) out.add(String(raw[i++])); if ("right" in c) out.add(String(raw[i++])); });
  return out;
}
// A calculation's steps, innermost first, each with this row's values: ROUND( 3.85 , 1) → 3.9
const calcHtml = (steps, x) => steps.map(st => `<div class="chk"><span class="mono">${st.tpl.split(/__A(\d+)__/)
  .map((p, j) => j % 2 ? v(x[st.args[+p]]) : esc(p)).join("")}</span><span class="arrow-r">→</span>${v(x[st.at])}</div>`).join("");
const chk = (...h) => `<div class="chk">${h.join(" ")}</div>`, to = x => `<span class="arrow-r">→</span>${v(x)}`;
// What went into an aggregate: each row's value (NULLs and DISTINCT repeats crossed out, as MySQL skips them)
function aggHtml(a, xs, res) {
  const end = res === undefined ? "" : to(res);
  if (!("at" in a)) return chk(`<span class="mono">${esc(a.sql)}</span>`, `<span class="expr">counts the rows:</span> <b>${xs.length}</b>`, end);
  const seen = new Set(); let nulls = 0, dups = 0;
  const items = xs.map(x => {
    const dup = a.distinct && x !== null && seen.has(String(x));
    if (x === null) nulls++; else if (dup) dups++; else seen.add(String(x));
    return x === null || dup ? `<span class="gone">${v(x)}</span>` : v(x);
  });
  const note = [nulls && "NULLs are skipped", dups && "repeats are skipped (DISTINCT)"].filter(Boolean).join(", ");
  return chk(`<span class="mono">${esc(a.fn)}(${a.distinct ? "DISTINCT " : ""}</span>${items.slice(0, 16).join(" ")}${items.length > 16 ? ` <span class="expr">+${items.length - 16} more</span>` : ""}<span class="mono">)</span>`, end)
    + (a.arg && !/^[\w`.]+$/.test(a.arg) ? chk(`<span class="expr">each value is ${esc(a.arg)}</span>`) : "") + (note ? chk(`<span class="expr">${note}</span>`) : "");
}
function checkLines(d, raw, aliases = {}) {
  let i = 0;
  return d.checks.map(c => {
    c = aliases[c.left] ? { ...c, left: `${aliases[c.left]} = ${c.left}` } : c;  // HAVING n >= 2 is checked as COUNT(*) >= 2
    const tv = raw[i++], l = "left" in c ? raw[i++] : undefined, r = "right" in c ? raw[i++] : undefined;
    let line;
    // name the right side too when it is a column or expression (a plain literal like 60000 would just repeat its value)
    const rName = "right" in c && /^[A-Za-z_`]/.test(c.right) && !/^(null|true|false)$/i.test(c.right) ? `<span class="expr">${esc(c.right)}</span> ` : "";
    if ("right" in c) line = `<span class="expr">${esc(c.left)}</span> ${v(l)} <b>${esc(c.op)}</b> ${rName}${v(r)}`;
    else if (c.list) line = `<span class="expr">${esc(c.left)}</span> ${v(l)} <b>${esc(c.rest.split(/\s/)[0])}</b> <span class="expr">the subquery's list</span> [${c.list.map(v).join(" ")}]`;
    else if ("left" in c) line = `<span class="expr">${esc(c.left)}</span> ${v(l)} <b>${esc(c.rest)}</b>`;
    else line = `<span class="expr">${esc(c.sql)}</span>`;
    const vals = "right" in c ? `${v(l)} ${esc(c.op)} ${v(r)}` : c.list ? `${v(l)} ${esc(c.rest.split(/\s/)[0])} [${c.list.map(v).join(" ")}]`
      : "left" in c ? `${v(l)} ${esc(c.rest)}` : `<span class="expr">${esc(c.sql)}</span>`;
    return { t: tv, vals, html: `<div class="chk">${line}<span class="arrow-r">→</span>${truth(tv)}</div>` + (c.calc ? `<div class="calc sub">${calcHtml(c.calc, raw)}</div>` : "") };
  });
}

// The line under a part's title: a visual when there is one, else a few words. The animations
// show what happens, so no paragraphs (errors keep their full message).
function brief(s) {
  const d = s.detail || {}, t = s.title;
  if (s.kind === "error") return esc(s.explain);
  if (d.type === "group") return groupKey(d);
  if (d.type === "set")  // a function's inputs, or a SET: each value before → after
    return `<span class="gkey">${d.vars.map(x => `<span><b>${esc(x.name)}</b> ${"before" in x ? `${v(x.before)} <span class="arrow-r">→</span> ` : "= "}${v(x.after)}</span>`).join("")}</span>` +
      (d.auto ? ` <span class="expr">(LeetCode picks its own test values)</span>` : "");
  const words = [
    [/^Starting/i, "Your tables before the code runs"],
    [/^FROM\b/i, "Start with every row"],
    [/\bJOIN\b/i, d.side === "LEFT" ? "Pair up matching rows (unmatched left rows get NULLs)"
      : d.side === "RIGHT" ? "Pair up matching rows (unmatched right rows get NULLs)" : "Pair up matching rows"],
    [/^,/, "Pair every row with every row"],
    [/^WHERE/i, /UPDATE|DELETE/.test(s.scope) ? "Find the rows where this is true" : "Keep the rows where this is true"],
    [/^SET\b/i, "Change each matched row"],
    [/^Remove the matched/i, "Remove each matched row"],
    [/^HAVING/i, "Keep the groups where this is true"],
    [/^SELECT/i, "Build the output columns"],
    [/^DISTINCT/i, "Drop duplicate rows"],
    [/^ORDER BY/i, "Sort the rows"],
    [/^LIMIT/i, "Keep only the first rows"],
  ].find(([re]) => re.test(t));
  if (words) return words[1];
  const first = (s.explain || "").split(/(?<=\.)\s/)[0].replace(/\s*\([^)]*\)/g, "");  // fallback: first sentence
  return esc(first.length > 90 ? first.slice(0, 90) + "…" : first);
}

// GROUP BY: a color key (one swatch per group, labeled with its value) instead of a paragraph
function groupKey(d) {
  const nk = d.keys.length, rows = d.summary.rows, MAX = 16;
  const items = rows.slice(0, MAX).map((r, g) => `<span><i style="background:${GC[g % GC.length]}"></i>Group ${g + 1}<em>${esc(r.v.slice(0, nk).map(x => x ?? "NULL").join(", "))}</em></span>`);
  return `<div class="gkey"><b>${esc(d.keys.join(", "))}</b>${items.join("")}${rows.length > MAX ? `<span>+${rows.length - MAX} more</span>` : ""}</div>`;
}

// input columns an expression reads (by name), so they can be outlined in the input table
function usedCols(c, cols) {
  if (c.star) return cols.map((x, k) => k);
  const full = x => x.replace(/`/g, "").toLowerCase(), bare = x => full(x).split(".").pop();
  const words = new Set((c.sql.replace(/'[^']*'/g, "").match(/[\w.`]+/g) || []).map(full));  // parent.id only matches parent.id; plain id matches any *.id
  return cols.map((x, k) => x === c.sql || words.has(full(x)) || words.has(bare(x)) || (/\W/.test(x) && c.sql.includes(x)) ? k : -1).filter(k => k >= 0);
}

// ---------- the board's model ----------
// Each part is shown as the same table being changed, not as new tables. A "state" is a table the way a part
// leaves it: { id, title, cols: [{k, label}], rows: [{k, v, g}] }. Every row and column keeps its key k from
// part to part, so the board can glide each value from where it was to where it is now.
let UID = 0, PF = [], PR = [], HID = new Map();  // HID: id -> the rows folded into one row (GROUP BY, COUNT(*) ...)
// A row that stands for several rows: r.h = { id, title, cols, rows, multi }; multi maps the key of each column whose
// cell stands for more than one value (aggregates, and columns that differed inside the group) to its SQL at fold time.
const folds = (title, cols, rows, multi) => { const h = { id: HID.size + 1, title, cols, rows, multi }; HID.set(h.id, h); return h; };
// those cells get a small [expand] after their value, which opens the folded rows
const more = (r, cols, cells) => !r.h ? cells : cells.map((c, j) => r.h.multi.has(cols[j]?.k) && c.t !== "…"
  ? { ...c, h: `${c.h}<button class="more" data-hid="${r.h.id}" data-col="${esc(cols[j].k)}" title="Show the ${r.h.rows.length} rows folded into this one">[expand]</button>`, t: c.t + " [expand]" } : c);  // PF[k]: part k's inner steps; PR[k]: [origin, copy] piece pairs (splits, merges, copies)
const uid = p => `${p}${++UID}`;
const same = (a, b) => String(a) === String(b);
const sameRow = (a, b) => a.length === b.length && a.every((x, i) => same(x, b[i]));
// a column's name without its table (e.id and id are the same column); expressions keep their full text
const bare = l => /^[\w`$]+(\.[\w`$]+)?$/.test(l) ? l.replace(/`/g, "").split(".").pop().toLowerCase() : l.toLowerCase();
const tagged = names => { const n = {}; return names.map(x => `${x}#${n[x] = (n[x] || 0) + 1}`); };  // a self-join has two "id"s
const cv = (x, c = "") => ({ h: x === undefined ? "…" : cellHtml(x), t: x === null ? "NULL" : x === undefined ? "…" : String(x), c: x === undefined ? "empty " + c : c });
const EMPTY = cv(undefined);
const hot = x => ({ ...cv(x), h: `<span class="pill">${cellHtml(x)}</span>` });
const withOld = (r, x, c) => r.old && c in r.old ? { h: `<s>${cellHtml(r.old[c])}</s>${cellHtml(x)}`, t: `${r.old[c]} ${x}`, c: "ch" } : cv(x);
const MARK = { dropped: "r-no", removed: "r-rem", added: "r-add", changed: "r-chg", match: "r-match" };

// Line a stage's rows up with the table it came from: matching columns keep their keys, and each row takes
// the key of the incoming row with the same values (or the same spot, when an UPDATE changed its values).
function adopt(labels, vals, input, title) {
  const it = input ? tagged(input.cols.map(c => bare(c.label))) : [];
  const map = tagged(labels.map(bare)).map(t => it.indexOf(t));
  const cols = labels.map((label, i) => ({ label, k: map[i] >= 0 ? input.cols[map[i]].k : uid("c") }));
  const shared = map.flatMap((m, i) => m >= 0 ? [[i, m]] : []), used = new Set();
  const take = j => { used.add(j); return input.rows[j].k; };
  const rows = vals.map(v => {
    const j = shared.length ? input.rows.findIndex((r, n) => !used.has(n) && shared.every(([i, m]) => same(r.v[m], v[i]))) : -1;
    return { k: j >= 0 ? take(j) : null, v };
  });
  if (input && vals.length === input.rows.length) rows.forEach((r, i) => { if (!r.k && !used.has(i)) r.k = take(i); });
  rows.forEach(r => { r.k ||= uid("r"); });
  const hs = new Map((input?.rows || []).filter(r => r.h).map(r => [r.k, r.h]));
  rows.forEach(r => { if (hs.has(r.k)) r.h = hs.get(r.k); });
  return { id: input?.id || uid("t"), title: title ?? input?.title ?? "", cols, rows };
}
// A state as a board table. o.cols / o.cells(row, i) replace the columns and cells, o.rc(row, i) adds a row class.
function T(st, o = {}) {
  return { id: st.id, title: o.title ?? st.title, right: o.right, cols: o.cols || st.cols,
    rows: st.rows.map((r, i) => ({ k: r.k, c: [MARK[r.m], o.rc?.(r, i)].filter(Boolean).join(" "),

// SELECT without FROM: each value; a subquery's answer flies down from where its steps ended.

  const rel = [];

function startPart(s, known) {

// FROM, UNION, results and anything without its own steps: the table, lined up with where it came from.
function plainPart(s, input, known) {

  const sts = s.tables.map((t, i) => {
    const base = i === 0 ? input : known[t.name.toLowerCase()];
    const st = adopt(t.cols, t.rows.map(r => r.v), base, from ? from[2] || from[1] : nameOf(t, base?.title || "Rows"));
    st.rows.forEach((r, n) => { r.m = t.rows[n].m; r.old = t.rows[n].old; });

const clean = st => ({ ...st, rows: st.rows.filter(r => !["dropped", "removed"].includes(r.m)).map(r => ({ k: r.k, v: r.v, g: r.g, h: r.h })) });

    const st = adopt(t.cols, t.rows.map(r => r.v), base, t.name);
    st.id = base?.id || `t:${t.name}`;
    st.rows.forEach((r, n) => { r.m = t.rows[n].m; r.old = t.rows[n].old; });
    known[t.name.toLowerCase()] = clean(st);

// UPDATE / DELETE, one matched row at a time.

    return { label: r.title, view: one(st, { rings: [{ k: "ring:row", table: st.id, rows: st.rows.filter(x => x.cur).map(x => x.k) }] }) };

// GROUP BY: colors, then sorted into groups, then each group folds into one row.
function groupPart(s, d, input) {

  const idx = scols.map(c => a.cols.findIndex(x => x.k === c.k));

    const m = members(g);

    frames.push({ label: `Group ${g} of ${G}`, sub: d.keys.map((kk, j) => `${kk} = ${key[j] ?? "NULL"}`).join(", "),
      card: aggs ? aggs.map((x, j) => aggHtml(x, "at" in x ? at.map(i => d.rows?.[i]?.[x.at] ?? null) : at, res(j))).join("")
        : sum.cols.slice(na).map((c, j) => chk(`<span class="expr">${esc(c)}</span>`, to(res(j)))).join(""),

// ---------- board layout: every box, header, cell and outline gets a spot ----------
const TH = 38, HH = 34, RH = 34, RN = 40, MAXV = 120;

    if (need > 0 && ws.length) ws[ws.length - 1] += need;  // room for the title: the last column takes the slack
    const w = RN + ws.reduce((p, q) => p + q, 0) + 2;

    items.push({ k: `h:${tb.id}:#`, cls: "th rn", x: x + 1, y: y + TH, w: RN, h: HH, html: "#" });

      const rc = (r.c ? " " + r.c : "") + (n === shown.length - 1 ? " last" : "");

      tb.cols.forEach((c, i) => { const cell = r.cells[i] || EMPTY;
        items.push({ k: `${r.k}|${c.k}`, cls: `td${rc}${cell.c ? " " + cell.c : ""}`, x: xs[i], y: ys[n], w: ws[i], h: RH, html: cell.h, t: cell.t, gc: r.gc }); });

    } else {

}

// ---------- drawing: pieces with the same key glide; new ones grow in, gone ones fade (or merge into a partner) ----------

function clearBoard() { live.forEach(r => r.el.remove()); live = new Map(); endAt = 0; }
const boardWidth = () => Math.max(320, ($(".board-wrap")?.clientWidth || 800) - 36);

// ---------- where each part lives in the code ----------
function range(s) {
  const text = SC.statements[s.stmt].text, whole = [0, text.replace(/[;\s]+$/, "").length];
  if (s.kind === "change" || s.kind === "error") return whole;
  const kw = s.rows ? "SET" : (/^(LEFT JOIN|RIGHT JOIN|INNER JOIN|CROSS JOIN|JOIN|GROUP BY|ORDER BY|FROM|WHERE|HAVING|SELECT|DISTINCT|LIMIT|UNION)/i.exec(s.title) || [])[1];
  const r = (!s.rows && locate(text, s.title, !!s.scope)) || (s.sql && locate(text, s.sql, !!s.scope)) || (kw && locate(text, kw, !!s.scope));
  return r ? [r[0], Math.max(r[1], clauseEnd(text, r[0]))] : whole;
}

// ---------- rendering ----------
let cur = 0, sub = 0, timer = null, F = [];
const badge = i => `<button class="badge ${i === cur ? "on" : i < cur ? "done" : ""}" data-i="${i}" data-kind="${MAIN[i].kind}" title="${esc(MAIN[i].title)}">${i + 1}</button>`;

function flow(k) {
  const s = MAIN[k], t = s.tables[0], p = feeder(k);
  if (!t || s.kind === "start") return "";
  const outN = s.detail?.type === "group" ? s.detail.summary.rows.length : liveRows(t);
  const inN = s.detail?.type === "filter" || s.detail?.type === "group" ? t.rows.length : p ? liveRows(p.tables[0]) : null;
  const unit = s.detail?.groups ? "groups" : "rows";
  return inN === null ? `out <b>${outN}</b> ${unit}` : `in <b>${inN}</b> ${unit} → out <b>${outN}</b>`;
}

// ---------- rendering: the code on top, then the stage (what this step does) and its board ----------
function renderCode() {
  const f = F[sub];
  let html = "";
  const starts = MAIN.map((x, i) => i).filter(i => MAIN[i].stmt === null);
  if (starts.length) html += `<div class="cb-start">${starts.map(badge).join("")}<span>Starting tables</span></div>`;
  SC.statements.forEach((st, k) => {
    if (st.phase !== "code") return;
    const mine = MAIN.map((x, i) => i).filter(i => MAIN[i].stmt === k);
    if (!mine.length) return;
    const text = st.text, lines = text.split("\n"), last = lines.length - 1;
    const at = mine.map(i => {
      const r = range(MAIN[i]), whole = ["change", "error"].includes(MAIN[i].kind);
      return { i, r, whole, from: whole ? last : lineOf(text, r[0]), to: whole ? last : lineOf(text, r[1]) };
    });
    const active = at.find(a => a.i === cur), under = active && f && f.under;
    html += `<div class="stmt">`;
    let offset = 0;
    lines.forEach((ln, li) => {
      const a0 = offset, a1 = offset + ln.length;
      // paint: highlight the active part, underline the inner step's focus
      const cuts = [a0, a1];
      if (active) cuts.push(...active.r);
      if (under) cuts.push(...under);
      const pts = [...new Set(cuts.filter(x => x >= a0 && x <= a1))].sort((a, b) => a - b);
      let src = "";
      for (let p = 0; p < pts.length - 1; p++) {
        const x0 = pts[p], x1 = pts[p + 1];
        let seg = highlight(text.slice(x0, x1));
        if (under && x0 >= under[0] && x1 <= under[1]) seg = `<u class="focus">${seg}</u>`;
        if (active && x0 >= active.r[0] && x1 <= active.r[1]) seg = `<mark class="hl">${seg}</mark>`;
        src += seg;
      }
      const dim = !active || (!active.whole && (li < lineOf(text, active.r[0]) || li > active.to));
      html += `<div class="line ${dim ? "dim" : "on"}"><div class="gut">${at.filter(a => a.from === li).map(a => badge(a.i)).join("")}</div><div class="src">${src || " "}</div></div>`;
      offset = a1 + 1;
    });
    html += `</div>`;
  });
  const box = $("#codebox");
  box.innerHTML = html;
  // keep the highlighted code in view inside the box
  const on = box.querySelector(".badge.on") || box.querySelector(".line.on");
  if (on) {
    const r = on.getBoundingClientRect(), b = box.getBoundingClientRect();
    if (r.top < b.top + 8 || r.bottom > b.bottom - 8) box.scrollTop += r.top - b.top - 24;
  }
}

function renderHead() {
  const s = MAIN[cur], f = F[sub], head = $("#shead");
  const dots = F.length > 1 ? F.map((x, i) => `<button class="${i === sub ? "on" : i < sub ? "done" : ""} ${x.end ? "end" : ""}" data-sub="${i}" title="${esc(x.label || "")}"></button>`).join("") : "";
  const first = cur === 0 && sub === 0, lastStep = cur === MAIN.length - 1 && sub === F.length - 1;
  const h0 = head.offsetHeight;
  $(".stage").dataset.kind = s.kind;
  head.innerHTML = `<div class="p-head"><span class="p-title">${esc(s.title)}</span>${s.scope ? `<span class="p-scope">${esc(s.scope)}</span>` : ""}<span class="p-flow">${flow(cur)}</span></div>
    <div class="p-explain">${brief(s)}</div>
    <div class="sub">
      <button class="btn" data-go="-1" aria-label="Previous step" ${first ? "disabled" : ""}>↑</button>
      <button class="btn" data-go="1" aria-label="Next step" ${lastStep ? "disabled" : ""}>↓</button>
      <button class="btn" data-play>${timer ? "❚❚ Pause" : "▶ Play"}</button>
      ${f.label ? `<span class="label">${esc(f.label)}${f.sub ? `<small>${esc(f.sub)}</small>` : ""}</span>` : ""}
      <div class="dots">${dots}</div></div>
    ${f.card ? `<div class="focus-card">${f.card}</div>` : ""}`;
  // the head grows or shrinks smoothly, so the board under it slides instead of jumping
  const h1 = head.offsetHeight;
  if (h0 && h0 !== h1 && !matchMedia("(prefers-reduced-motion: reduce)").matches)
    head.animate({ height: [h0 + "px", h1 + "px"] }, { duration: 300, easing: EASE });
}

let was = -1;  // the part shown before, so a move between two parts can use both parts' splits and merges
function show(o = {}) {
  const f = F[sub];
  renderCode(); renderHead();
  $("#label").textContent = `Part ${cur + 1} of ${MAIN.length}`;
  $("#prev").disabled = cur === 0;
  $("#next").disabled = cur === MAIN.length - 1;
  $("#end").disabled = cur === MAIN.length - 1 && sub === F.length - 1;
  const items = layout(f.view, boardWidth());
  draw(items, [...PR[cur], ...(was >= 0 && was !== cur ? PR[was] : [])], { exitLast: f.exitLast, instant: o.instant });
  was = cur;
  follow(items);
}
// keep the row being looked at on screen (below the pinned code)
function follow(items) {
  const ring = items.find(i => i.k === "ring:row"); if (!ring) return;
  const b = $("#board").getBoundingClientRect(), top = b.top + ring.y, bottom = top + ring.h;
  const safeTop = $("#codebox").getBoundingClientRect().bottom + 12, safeBottom = innerHeight - 16;
  if (top < safeTop) scrollBy({ top: top - safeTop, behavior: "smooth" });
  else if (bottom > safeBottom) scrollBy({ top: Math.min(bottom - safeBottom, top - safeTop), behavior: "smooth" });
}

function go(i, at = 0, o) {
  if (i < 0 || i >= MAIN.length) return;
  cur = i; F = PF[cur]; sub = at < 0 ? F.length - 1 : Math.min(at, F.length - 1);
  show(o);
}
// Inner steps run on past the end of a part into the next one (and back), so ↓ walks the whole query.
function step(n) {
  if (n < 0) return go(cur - 1, -1);
  if (n >= F.length) return go(cur + 1, 0);
  sub = n; show();
}
const sleep = ms => new Promise(r => setTimeout(r, ms));
function stop() { if (timer) { timer = null; renderHead(); } }
// Play waits for each step's movement to finish, then pauses so it can be read.
async function play() {
  if (timer) return stop();
  const me = timer = {};
  renderHead();
  while (timer === me && !(cur === MAIN.length - 1 && sub === F.length - 1)) {
    await sleep(Math.max(0, endAt - performance.now()) + 1100);
    if (timer !== me) return;
    step(sub + 1);
  }
  if (timer === me) stop();
}

$("#prev").onclick = () => { stop(); go(cur - 1); };
$("#next").onclick = () => { stop(); go(cur + 1); };
$("#end").onclick = () => { stop(); go(MAIN.length - 1, -1); };  // the last part, at its last step
function openHidden(id, col) {
  const h = HID.get(id); if (!h) return;
  const lit = new Set(usedCols({ sql: h.multi.get(col) || "" }, h.cols));  // the column clicked (or what its aggregate reads)
  const td = (x, j, tag = "td") => `<${tag}${lit.has(j) ? ' class="lit"' : ""}>${tag === "th" ? esc(x) : cellHtml(x)}</${tag}>`;
  $("#hid-title").innerHTML = `${plural(h.rows.length, "row")} folded into this row <span class="expr">${esc(h.title)}</span>`;
  $("#hid-body").innerHTML = `<div class="hid-wrap"><table class="hid"><thead><tr><th>#</th>${h.cols.map((c, j) => td(c, j, "th")).join("")}</tr></thead>
    <tbody>${h.rows.map((r, n) => `<tr><td class="rn">${n + 1}</td>${r.map((x, j) => td(x, j)).join("")}</tr>`).join("")}</tbody></table></div>`;
  $("#hid").showModal();
  // outline the lit columns the way the board does, measured once the table is laid out
  const tb = $("#hid-body table"), wrap = $("#hid-body .hid-wrap");
  for (const j of lit) {
    const th = tb.rows[0].cells[j + 1];
    wrap.insertAdjacentHTML("beforeend", `<div class="ring col" style="position:absolute; left:${tb.offsetLeft + th.offsetLeft + 2}px; top:${tb.offsetTop + 2}px; width:${th.offsetWidth - 4}px; height:${tb.offsetHeight - 4}px"></div>`);
  }
}
$("#hid").onclick = e => { if (e.target === $("#hid") || e.target.closest("#hid-x")) $("#hid").close(); };  // outside or ✕ closes
$("#doc").onclick = e => {
  const m = e.target.closest("[data-hid]"); if (m) return openHidden(+m.dataset.hid, m.dataset.col);
  const b = e.target.closest(".badge[data-i]"); if (b) { stop(); return go(+b.dataset.i); }
  const g = e.target.closest("[data-go]"); if (g) { stop(); return step(sub + +g.dataset.go); }
  const d = e.target.closest("[data-sub]"); if (d) { stop(); return step(+d.dataset.sub); }
  if (e.target.closest("[data-play]")) play();
};
document.addEventListener("keydown", e => {
  if (e.target.closest("#chat")) return;
  if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); run(); return; }
  if (!MAIN.length || e.target.closest("textarea, input") || (e.key === " " && e.target.closest("button"))) return;
  const keys = { ArrowRight: () => go(cur + 1), ArrowLeft: () => go(cur - 1), ArrowDown: () => step(sub + 1), ArrowUp: () => step(sub - 1) };
  if (keys[e.key]) { e.preventDefault(); stop(); keys[e.key](); }
  else if (e.key === " ") { e.preventDefault(); play(); }
});
let resizing;
// The stepper is normally 1080px wide; a wider table widens it (as far as the window allows) so the table
// shows whole instead of scrolling. Sized once per run from the widest table in any part, so it stays still.
let widest = 0;
function fitWidth() {
  const v = $(".view"), cs = getComputedStyle(v);
  const room = v.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  $("#doc").style.maxWidth = Math.min(room, Math.max(1080, widest + 36 + 2 + 40)) + "px";  // board padding, border, rings
}
addEventListener("resize", () => { clearTimeout(resizing); resizing = setTimeout(() => { if (MAIN.length && $("#board")) { fitWidth(); show({ instant: true }); } }, 150); });

// ---------- AI helper: a chat that sees the schema, the code and the step on screen ----------
const CHAT = [];
let asking = false;
fetch("/config").then(r => r.json()).then(c => { if (c.ai) { $("#ask").hidden = false; $("#chat-note").textContent = c.ai_note; } }).catch(() => {});

// a small, safe markdown: code blocks (SQL colored), `code`, **bold**, headings, lists
const inline = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/^#{1,4} (.*)$/, "<b>$1</b>");
function mdText(t) {
  let out = "", list = null;
  const close = () => { if (list) out += `</${list === "table" ? "tbody></table" : list}>`; list = null; };
  for (const l of t.split("\n")) {
    if (/^\s*\|.*\|\s*$/.test(l)) {  // a table row; the |---| line under the header is skipped
      if (/^[\s|:-]+$/.test(l)) continue;
      const cells = l.trim().slice(1, -1).split("|").map(c => inline(c.trim()));
      if (list !== "table") { close(); out += `<table><thead><tr>${cells.map(c => `<th>${c}</th>`).join("")}</tr></thead><tbody>`; list = "table"; }
      else out += `<tr>${cells.map(c => `<td>${c}</td>`).join("")}</tr>`;
      continue;
    }
    const m = l.match(/^\s*(?:([-*•])|\d+[.)])\s+(.*)/);
    if (!m) { close(); if (l.trim()) out += `<p>${inline(l)}</p>`; continue; }
    const k = m[1] ? "ul" : "ol";
    if (list !== k) { close(); out += `<${k}>`; list = k; }
    out += `<li>${inline(m[2])}</li>`;
  }
  close();
  return out;
}
function md(t) {
  const p = t.split(/```(\w*)\n?([\s\S]*?)(?:```|$)/);  // text, language, code, text, ...
  let out = "";
  for (let i = 0; i < p.length; i += 3) {
    out += mdText(p[i]);
    if (i + 2 < p.length) out += `<pre><code>${/^(sql|mysql)?$/i.test(p[i + 1]) ? highlight(p[i + 2].replace(/\n$/, "")) : esc(p[i + 2])}</code></pre>`;
  }
  return out;
}

// what's on screen, in words, for the AI
function onScreen() {
  const c = { setup: $("#setup").value, code: $("#code").value, instructions: $("#notes").value };
  if (!MAIN.length) return c;
  const s = MAIN[cur], f = F[sub];
  const tables = (s.tables || []).map(t => `Table ${t.name || ""} (${t.cols.join(", ")}):\n` +
    t.rows.slice(0, 30).map(r => r.v.map(v => v === null ? "NULL" : v).join(" | ") + (r.m ? `   [${r.m}]` : "")).join("\n")).join("\n\n");
  c.step = `part ${cur + 1} of ${MAIN.length}, "${s.title}"${s.scope ? ` (inside ${s.scope})` : ""}${f && f.label ? `, at "${f.label}"` : ""}. ` +
    `${s.kind === "error" ? "MySQL ERROR: " : ""}${s.explain || ""}\n${tables}`;
  return c;
}

function drawChat() {
  const box = $("#msgs"), err = MAIN.some(m => m.kind === "error");
  const starters = [err ? "What does this error mean, and how do I fix it?" : "Explain the step I'm looking at",
    "Why doesn't my query give the right answer?", "Can I get a hint?"];
  box.innerHTML = CHAT.length ? CHAT.map((m, i) => m.role === "user" ? `<div class="msg user">${esc(m.content)}</div>`
      : `<div class="msg ai${m.err ? " err" : ""}${asking && i === CHAT.length - 1 ? " typing" : ""}">${m.err ? esc(m.content) : md(m.content)}</div>`).join("")
    : `<div class="starters"><p>Ask anything about your SQL. I can see your schema, your code, and the step you're on.</p>${starters.map(q => `<button class="btn" data-q="${esc(q)}">${esc(q)}</button>`).join("")}</div>`;
  box.scrollTop = box.scrollHeight;
}

async function ask(q) {
  q = q.trim();
  if (!q || asking) return;
  asking = true; $("#send").disabled = true; $("#ask-in").value = "";
  const a = { role: "assistant", content: "" };
  CHAT.push({ role: "user", content: q }, a);
  drawChat();
  try {
    const r = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: CHAT.filter(m => m !== a && !m.err), context: onScreen() }) });
    if (!r.ok) throw new Error(await r.text());
    const read = r.body.getReader(), dec = new TextDecoder();
    for (let x; !(x = await read.read()).done;) { a.content += dec.decode(x.value, { stream: true }); drawChat(); }
    if (!a.content.trim()) throw new Error("The AI didn't answer. Try again.");
  } catch (e) {
    Object.assign(a, { content: e.message || "Couldn't reach the AI. Try again.", err: true });
  }
  asking = false; $("#send").disabled = false;
  drawChat();
}

function toggleChat(open = $("#chat").hidden) {
  $("#chat").hidden = !open;
  document.body.classList.toggle("chatting", open);
  $("#ask").classList.toggle("on", open);
  if (open) { drawChat(); $("#ask-in").focus(); }
  dispatchEvent(new Event("resize"));  // the board gets narrower or wider
}
$("#ask").onclick = () => toggleChat();
$("#chat-x").onclick = () => toggleChat(false);
$("#msgs").onclick = e => { const b = e.target.closest("[data-q]"); if (b) ask(b.dataset.q); };
$("#chat-form").onsubmit = e => { e.preventDefault(); ask($("#ask-in").value); };
$("#ask-in").onkeydown = e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask(e.target.value); } };

// ---------- run ----------
const RUN_BTN = `<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4l14 8-14 8z"/></svg><span>Run</span>`;
async function run() {
  const btn = $("#run");
  if (btn.disabled) return;
  btn.disabled = true;
  btn.innerHTML = `<div class="spin"></div><span>Running</span>`;
  try {
    const r = await fetch("/run", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ setup: $("#setup").value, code: $("#code").value }) });
    const data = await r.json();
    if (data.error) throw new Error(data.error);
    build(data);
    if (!MAIN.length) throw new Error("There was nothing to step through.");
    prepare();
    widest = Math.max(0, ...PF.flat().flatMap(f => layout(f.view, Infinity).filter(i => i.cls === "box").map(i => i.w)));
    timer = null; was = -1;
    $(".dock").hidden = false;
    $("#doc").innerHTML = `<div class="card codebox" id="codebox"></div>
      <div class="card stage"><div class="stage-head" id="shead"></div><div class="board-wrap"><div id="board"></div></div></div>`;
    clearBoard();
    fitWidth();
    go(Math.max(0, MAIN.findIndex(m => m.kind === "error")), 0, { instant: true });  // an error is what the user needs to see first
  } catch (e) {
    MAIN = []; timer = null; $("#doc").style.maxWidth = "";
    $(".dock").hidden = true;
    $("#doc").innerHTML = `<div class="error-box"><b>Something went wrong.</b><br>${esc(e.message)}</div>`;
  } finally {
    btn.disabled = false;
    btn.innerHTML = RUN_BTN;
  }
}
$("#run").onclick = run;
run();  // the database is ready when the page loads, so show the saved code straight away
</script>
</body>
</html>
