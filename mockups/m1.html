<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clause Pipeline</title>
<meta name="description" content="Each statement becomes a left-to-right pipeline of the clauses in the order MySQL runs them, with row counts flowing between stages and the current stage's table below.">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>
body { padding: 20px 24px 32px; }
.top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.tabs { display: flex; gap: 4px; padding: 4px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 11px; flex-wrap: wrap; }
.tab { border: 0; background: none; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; color: var(--muted); max-width: 260px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tab b { color: inherit; font-weight: 600; margin-right: 6px; }
.tab.on { background: var(--panel); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.2); }
.nav { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.nav .count { font: 500 12px var(--mono); color: var(--muted); min-width: 56px; text-align: center; }

.hint { margin: 22px 0 8px; font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.hint svg { color: var(--accent); }
.pipe-wrap { overflow-x: auto; padding: 4px 2px 12px; }
.pipe { display: flex; align-items: center; min-width: max-content; }
.lane { display: flex; align-items: center; border: 1px dashed var(--line-2); border-radius: 14px; padding: 22px 10px 10px; position: relative; background: color-mix(in srgb, var(--panel-2) 60%, transparent); }
.lane > .label { position: absolute; top: 5px; left: 12px; font-size: 10.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.chip { display: flex; flex-direction: column; gap: 2px; min-width: 110px; max-width: 190px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--panel); cursor: pointer; text-align: left; transition: transform .12s, border-color .12s, background .12s; }
.chip:hover { transform: translateY(-1px); border-color: var(--faint); }
.chip .kw { font: 700 12px var(--mono); letter-spacing: .02em; color: var(--kw); }
.chip .rest { font: 12px var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip .cnt { margin-top: 4px; font-size: 11.5px; color: var(--muted); }
.chip.future { opacity: .5; }
.chip.on { border-color: var(--accent); background: var(--accent-bg); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
.chip.on .rest, .chip.on .cnt { color: var(--text); }
.chip[data-kind=change] .kw { color: var(--amber); }
.chip[data-kind=row] .kw, .chip[data-kind=start] .kw { color: var(--blue); }
.chip[data-kind=result] .kw { color: var(--green); }
.arrow { display: flex; flex-direction: column; align-items: center; min-width: 40px; color: var(--faint); font: 500 10.5px var(--mono); }
.arrow svg { display: block; }
.arrow .delta { color: var(--red); }
.arrow .delta.up { color: var(--green); }

.body { display: grid; grid-template-columns: minmax(280px, 380px) 1fr; gap: 24px; margin-top: 12px; align-items: start; }
.now { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
h1 { font: 600 22px/1.3 var(--mono); margin: 4px 0 12px; word-break: break-word; }
.explain { font-size: 15.5px; line-height: 1.65; margin: 0 0 16px; }
pre.code { margin: 0; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); font: 12.5px/1.6 var(--mono); white-space: pre-wrap; word-break: break-word; }
.tables { display: grid; gap: 16px; }
@media (max-width: 1050px) { .body { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="top">
  <div class="tabs" id="tabs"></div>
  <div class="nav">
    <button class="btn" id="prev" aria-label="Previous step">‹</button>
    <span class="count" id="count"></span>
    <button class="btn primary" id="next" aria-label="Next step">Next ›</button>
  </div>
</div>
<div class="hint"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>MySQL runs these stages left to right. That is not the order you write them in.</div>
<div class="pipe-wrap"><div class="pipe" id="pipe"></div></div>
<div class="body" id="body"></div>

<script src="data.js"></script>
<script src="common.js"></script>
<script>
let cur = 0;
const groupOf = s => s.stmt === null ? "start" : s.stmt;
const groups = [...new Set(STEPS.map(groupOf))];

function chipParts(s) {
  if (s.kind === "start") return ["START", "your tables"];
  if (s.kind === "error") return ["ERROR", ""];
  if (s.kind === "change") return [s.title.split(" ")[0].toUpperCase(), "apply to table"];
  let m = /^Row (\d+) of (\d+)/.exec(s.title);
  if (m) return [`ROW ${m[1]}/${m[2]}`, s.scope.split(" ")[0].toLowerCase()];
  if (/^Find rows/.test(s.title)) return ["MATCH", "find rows"];
  m = /^(LEFT JOIN|RIGHT JOIN|INNER JOIN|CROSS JOIN|JOIN|GROUP BY|ORDER BY|FROM|WHERE|HAVING|SELECT|DISTINCT|LIMIT|UNION ALL|UNION|WITH RECURSIVE)\b\s*(.*)$/i.exec(s.title);
  return m ? [m[1].toUpperCase(), m[2]] : [s.title, ""];
}

const ARROW = d => `<div class="arrow">${d || "&nbsp;"}<svg width="28" height="10" viewBox="0 0 28 10"><path d="M0 5h25M21 1l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></div>`;

function renderPipe() {
  const g = groupOf(STEPS[cur]);
  // consecutive steps with the same scope form one lane; nested scopes get a dashed box
  const runs = [];
  STEPS.forEach((s, i) => {
    if (groupOf(s) !== g) return;
    const last = runs[runs.length - 1];
    last && last.scope === s.scope ? last.idx.push(i) : runs.push({ scope: s.scope, idx: [i] });
  });
  const chip = i => {
    const s = STEPS[i], [kw, rest] = chipParts(s), t = mainTable(s), n = t ? liveRows(t) : null;
    const cls = i === cur ? "on" : i > cur ? "future" : "";
    return `<button class="chip ${cls}" data-i="${i}" data-kind="${s.kind}"><span class="kw">${esc(kw)}</span>
      ${rest ? `<span class="rest">${esc(rest)}</span>` : ""}${n !== null ? `<span class="cnt">${plural(n, "row")}</span>` : ""}</button>`;
  };
  const count = i => { const t = mainTable(STEPS[i]); return t ? liveRows(t) : null; };
  $("#pipe").innerHTML = runs.map(r => {
    const inner = r.idx.map((i, k) => {
      if (!k) return chip(i);
      const a = count(r.idx[k - 1]), b = count(i);
      return ARROW(a !== null && b !== null && a !== b ? `<span class="delta ${b > a ? "up" : ""}">${a}→${b}</span>` : "") + chip(i);
    }).join("");
    return r.scope ? `<div class="lane"><span class="label">${esc(r.scope)}</span>${inner}</div>` : inner;
  }).join(ARROW());
  $("#pipe .chip.on")?.scrollIntoView({ block: "nearest", inline: "center" });
}

function renderTabs() {
  const g = groupOf(STEPS[cur]);
  $("#tabs").innerHTML = groups.map(k => {
    if (k === "start") return `<button class="tab ${g === k ? "on" : ""}" data-g="start"><b>Start</b></button>`;
    const n = SC.statements.slice(0, k + 1).filter(x => x.phase === "code").length;
    return `<button class="tab ${g === k ? "on" : ""}" data-g="${k}" title="${esc(SC.statements[k].text)}"><b>${n}</b>${esc(SC.statements[k].text.replace(/\s+/g, " "))}</button>`;
  }).join("");
}

function go(i) {
  cur = clamp(i);
  const s = STEPS[cur];
  renderTabs(); renderPipe();
  const code = s.stmt !== null ? `<pre class="code">${codeHtml(SC.statements[s.stmt].text, s.kind === "change" ? null : stepRange(s))}</pre>` : "";
  const tables = s.tables.length ? s.tables.map(t => tableHtml(t)).join("") : "";
  $("#body").innerHTML = `<div class="fade"><div class="now">${s.scope ? esc(s.scope) : s.kind === "start" ? "Before your code" : "Now running"}</div>
      <h1>${esc(s.title)}</h1><p class="explain">${esc(s.explain)}</p>${code}</div>
    <div class="tables fade">${tables}</div>`;
  $("#count").textContent = `${cur + 1} / ${STEPS.length}`;
  $("#prev").disabled = cur === 0;
  $("#next").disabled = cur === STEPS.length - 1;
}

$("#prev").onclick = () => go(cur - 1);
$("#next").onclick = () => go(cur + 1);
$("#pipe").onclick = e => { const c = e.target.closest(".chip"); if (c) go(+c.dataset.i); };
$("#tabs").onclick = e => { const t = e.target.closest(".tab"); if (t) go(STEPS.findIndex(s => String(groupOf(s)) === t.dataset.g)); };
keys(go, () => cur);
go(0);
</script>
</body>
</html>
