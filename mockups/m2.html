<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Before and After</title>
<meta name="description" content="Every step is shown as the data going in on the left and the data coming out on the right, with the clause and one sentence in between explaining the change.">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>
body { padding: 18px 24px 32px; }
.bar { display: flex; align-items: center; gap: 12px; }
.dots { flex: 1; display: flex; gap: 3px; align-items: center; height: 26px; }
.dots button { flex: 1; height: 6px; border: 0; border-radius: 3px; background: var(--line-2); cursor: pointer; padding: 0; transition: height .12s, background .12s; }
.dots button.done { background: color-mix(in srgb, var(--accent) 45%, var(--line-2)); }
.dots button.on { background: var(--accent); height: 14px; }
.dots button:hover { height: 12px; }
.count { font: 500 12px var(--mono); color: var(--muted); }

.head { margin: 22px 0 18px; max-width: 900px; }
.where { font-size: 12px; color: var(--muted); font-weight: 500; }
.where b { color: var(--text); }
h1 { font: 600 24px/1.3 var(--mono); margin: 4px 0 8px; word-break: break-word; }
.explain { font-size: 16px; line-height: 1.6; margin: 0; }

.ba { display: grid; grid-template-columns: 1fr 120px 1fr; gap: 0; align-items: start; }
.side .label { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; display: flex; gap: 8px; align-items: center; }
.side.after .label { color: var(--accent); }
.mid { display: flex; flex-direction: column; align-items: center; gap: 8px; padding-top: 60px; color: var(--accent); text-align: center; }
.mid .delta { font: 600 13px var(--mono); color: var(--text); }
.mid .delta small { display: block; font: 500 11px var(--sans); color: var(--muted); }
.side .stack { display: grid; gap: 14px; }
.nothing { border: 1px dashed var(--line-2); border-radius: 12px; padding: 28px 16px; text-align: center; color: var(--muted); font-size: 13px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 16px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
details.code { margin-top: 22px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
details.code summary { padding: 9px 14px; cursor: pointer; font-size: 12px; color: var(--muted); }
details.code pre { margin: 0; padding: 12px 14px; border-top: 1px solid var(--line); font: 12.5px/1.6 var(--mono); white-space: pre-wrap; }
@media (max-width: 1000px) { .ba { grid-template-columns: 1fr; } .mid { flex-direction: row; padding: 12px 0; justify-content: center; } .mid svg { transform: rotate(90deg); } }
</style>
</head>
<body>
<div class="bar">
  <button class="btn" id="prev" aria-label="Previous step">‹ Back</button>
  <div class="dots" id="dots"></div>
  <span class="count" id="count"></span>
  <button class="btn primary" id="next" aria-label="Next step">Next ›</button>
</div>
<div id="view"></div>

<script src="data.js"></script>
<script src="common.js"></script>
<script>
let cur = 0;
$("#dots").innerHTML = STEPS.map((s, i) => `<button data-i="${i}" title="${i + 1}. ${esc(s.title)}" aria-label="Step ${i + 1}"></button>`).join("");

// The previous step in the same statement and scope feeds this one.
function feeder(i) {
  const s = STEPS[i];
  for (let j = i - 1; j >= 0; j--) {
    const p = STEPS[j];
    if (p.stmt === s.stmt && p.scope === s.scope && p.tables.length) return p;
    if (p.stmt !== s.stmt) break;
  }
  return null;
}
const strip = rows => rows.map(r => ({ v: r.v, g: r.g }));

// Split one step into what went in and what came out.
function beforeAfter(i) {
  const s = STEPS[i], t = mainTable(s);
  if (!t) return { before: null, after: null };
  const has = m => t.rows.some(r => r.m === m);
  const cur = t.rows.find(r => r.m === "current");
  if (s.kind === "start") return { before: null, after: s.tables, why: "Empty database" };
  if (has("dropped")) return {
    before: [{ ...t, rows: t.rows.map(r => ({ v: r.v, m: r.m === "dropped" ? "out" : undefined })) }],
    after: [{ ...t, rows: t.rows.filter(r => r.m !== "dropped").map(r => ({ v: r.v })) }] };
  if (cur && s.kind === "row") {  // one row being processed
    const done = t.rows.filter(r => r !== cur && r.m === "removed");
    const rows = t.rows.filter(r => !done.includes(r));
    if (cur.old) return {
      before: [{ ...t, rows: rows.map(r => r === cur ? { v: r.v.map((v, c) => c in r.old ? r.old[c] : v), m: "current" } : { v: r.v }) }],
      after: [{ ...t, rows: rows.map(r => r === cur ? { v: r.v, m: "current", old: r.old } : { v: r.v }) }] };
    return { before: [{ ...t, rows: rows.map(r => ({ v: r.v, m: r === cur ? "out" : undefined })) }],
             after: [{ ...t, rows: rows.filter(r => r !== cur).map(r => ({ v: r.v })) }] };
  }
  if (has("match")) return { before: [{ ...t, rows: t.rows.map(r => ({ v: r.v, m: r.m })) }],
    after: [{ ...t, name: "Rows that will change", rows: t.rows.filter(r => r.m === "match").map(r => ({ v: r.v, m: "match" })) }] };
  if (has("removed") || has("added") || t.rows.some(r => r.old)) {
    return {
      before: s.tables.filter(x => x.badge !== "new table").map(x => ({ ...x, rows: x.rows.filter(r => r.m !== "added")
        .map(r => ({ v: r.old ? r.v.map((v, c) => c in r.old ? r.old[c] : v) : r.v, m: r.m === "removed" ? "out" : r.old ? "changed" : undefined })) })),
      after: s.tables.filter(x => x.badge !== "dropped").map(x => ({ ...x, rows: x.rows.filter(r => r.m !== "removed") })) };
  }
  const p = feeder(i);
  if (/^FROM\b/.test(s.title) || !p) return { before: null, after: [t], why: /^FROM\b/.test(s.title) ? "Read straight from the stored table" : "Start of this part" };
  return { before: [{ ...mainTable(p), rows: strip(mainTable(p).rows.filter(r => !["dropped", "removed"].includes(r.m))) }], after: [t] };
}

function go(i) {
  cur = clamp(i);
  const s = STEPS[cur], { before, after, why } = beforeAfter(cur);
  const bN = before ? before.reduce((n, t) => n + t.rows.filter(r => r.m !== "out").length, 0) : null;
  const aN = after ? after.reduce((n, t) => n + liveRows(t), 0) : null;
  const side = (ts, empty, cls) => ts ? ts.map(t => tableHtml(t, { cls })).join("") : `<div class="nothing">${empty}</div>`;
  const stmtN = s.stmt !== null ? SC.statements.slice(0, s.stmt + 1).filter(x => x.phase === "code").length : null;
  const legendItems = [["out", "var(--red)", "Removed by this step"], ["changed", "var(--amber)", "Changed (old value crossed out)"],
    ["current", "var(--blue)", "Row being processed"], ["match", "var(--blue)", "Matches WHERE"], ["added", "var(--green)", "Added"]]
    .filter(([m]) => [...(before || []), ...(after || [])].some(t => t.rows.some(r => r.m === m || (m === "changed" && r.old))));
  if ((after || []).some(t => t.rows.some(r => r.g !== undefined))) legendItems.push(["", GC[0], "Color band = one group"]);

  $("#view").innerHTML = `<div class="fade">
    <div class="head">
      <div class="where">${stmtN ? `Statement <b>${stmtN}</b>` : "<b>Before your code</b>"}${s.scope ? ` · ${esc(s.scope)}` : ""}</div>
      <h1>${esc(s.title)}</h1><p class="explain">${esc(s.explain)}</p>
    </div>
    ${s.tables.length ? `<div class="ba">
      <div class="side"><div class="label">Going in</div><div class="stack">${side(before, why || "Nothing yet")}</div></div>
      <div class="mid"><svg width="40" height="18" viewBox="0 0 40 18"><path d="M0 9h36M29 2l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        ${bN !== null && aN !== null ? `<div class="delta">${bN} → ${aN}<small>rows</small></div>` : ""}</div>
      <div class="side after"><div class="label">Coming out</div><div class="stack">${side(after, "Nothing")}</div></div>
    </div>` : ""}
    ${legendItems.length ? `<div class="legend">${legendItems.map(([, c, l]) => `<span><i style="background:${c}"></i>${l}</span>`).join("")}</div>` : ""}
    ${s.stmt !== null ? `<details class="code" open><summary>The SQL (this step highlighted)</summary><pre>${codeHtml(SC.statements[s.stmt].text, s.kind === "change" ? null : stepRange(s))}</pre></details>` : ""}
  </div>`;
  document.querySelectorAll("#dots button").forEach((b, j) => { b.className = j === cur ? "on" : j < cur ? "done" : ""; });
  $("#count").textContent = `${cur + 1} / ${STEPS.length}`;
  $("#prev").disabled = cur === 0;
  $("#next").disabled = cur === STEPS.length - 1;
}
$("#prev").onclick = () => go(cur - 1);
$("#next").onclick = () => go(cur + 1);
$("#dots").onclick = e => { const b = e.target.closest("button"); if (b) go(+b.dataset.i); };
keys(go, () => cur);
go(0);
</script>
</body>
</html>
