<!-- THESIS: Rows are tangible objects arranged by what happens to them.
OWN-WORLD: Violet tooling, neutral workbench, compact data cards and labeled group trays.
STORY: Track one row through matching, editing, exclusion, grouping and output.
FIRST VIEWPORT: Vertical execution trail beside an explanation and a row-card work area; playback stays below.
FORM: Row-card workshop; joined source records share one card, never a before/after comparison. Only this file is created. -->
<header class="topbar"><div class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m5 6 6 6-6 6M14 6h5M14 12h5M14 18h5"/></svg>SQL Stepper</div><span class="concept">Row Workshop</span><div id="scenario" class="scenario"></div><button id="sql-toggle" aria-expanded="false" aria-controls="source">View SQL</button></header><section id="source" class="source" hidden aria-label="SQL source"><h2>Your SQL</h2><div id="source-content"></div><details><summary>Setup SQL</summary><pre id="setup-code"></pre></details></section>
<main class="workshop"><nav class="trail" aria-label="Logical execution order"><h2>Execution order</h2><p>Follow the actual steps</p><ol id="trail"></ol></nav><section class="workspace"><div class="workspace-top"><div id="scope" class="scope"></div><span id="step-count"></span></div><h1 id="heading"></h1><p id="explain" class="explain"></p><div class="sql-fragment"><code id="active-sql"></code></div><div class="board-note"><p class="change-heading">What moved or changed</p><p id="delta" class="delta"></p></div><div class="board-caption"><span>One card = one row at this stage</span><span>NULL = no value</span></div><div id="board"></div></section></main>
<footer class="playback"><label for="jump">Jump to step</label><select id="jump" aria-label="Jump to any execution step"></select><div class="controls"><span class="keyboard">Use ← → keys</span><button id="back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg>Back</button><button id="next" class="primary next">Next step<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m10 6 6 6-6 6"/></svg></button></div></footer><p id="live" class="step-live" role="status" aria-live="polite"></p>

<script>const MODE='cards';

'use strict';
const requested=new URLSearchParams(location.search).get('s');
const scenario=window.SCENARIOS[/^[012]$/.test(requested||'')?Number(requested):0];
const steps=scenario.steps;
let current=0, selectedCell=null;
const $=id=>document.getElementById(id);
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const value=v=>v===null?'<span class="null">NULL</span>':esc(v);
const excluded=r=>r.m==='dropped'||r.m==='removed';
const labels={current:'Updating now',changed:'Changed earlier',match:'Matches WHERE',dropped:'Filtered out',removed:'Deleted',added:'Added'};
const codeStatements=scenario.statements.map((s,i)=>({...s,index:i})).filter(s=>s.phase==='code');
function stage(s){if(s.kind==='start')return 'Starting tables';if(s.kind==='row')return s.title;if(s.kind==='change')return 'UPDATE complete';if(s.title==='Find rows to update')return 'WHERE · find matches';if(/LEFT JOIN/.test(s.title))return 'LEFT JOIN';return s.title.match(/^(ORDER BY|GROUP BY|SELECT|FROM|WHERE|HAVING|LIMIT|DISTINCT)/)?.[0]||s.title;}
function friendly(s){if(s.kind==='start')return 'Meet your starting data';if(s.kind==='row')return 'One row. One change.';if(s.kind==='change')return 'The update is complete';if(s.title==='Find rows to update')return 'Find the rows to change';if(s.scope.includes('subquery'))return /^FROM/.test(s.title)?'Step into the subquery':'Bring back the parent IDs';return ({FROM:'Start with the source rows','LEFT JOIN':'Find each employee’s manager',WHERE:'Keep the rows that qualify','GROUP BY':'Gather rows into groups',HAVING:'Check each whole group',SELECT:'Build the output columns','ORDER BY':'Put the result in order'})[stage(s)]||s.title;}
function context(s){if(s.stmt===null)return '<span>Setup complete</span><strong>Before your code runs</strong>';const n=codeStatements.findIndex(x=>x.index===s.stmt)+1;return `<span>Statement ${n} of ${codeStatements.length}</span><strong class="branch">${esc(s.scope||'Main statement')}</strong>`;}
// Mask nested expressions only for finding top-level clause boundaries; preserve source text.
function clauses(text){let depth=0,quote='',mask='';for(let i=0;i<text.length;i++){const c=text[i];if(quote){mask+=' ';if(c===quote&&text[i-1]!=='\\')quote='';continue}if(c==='\''||c==='"'||c==='`'){quote=c;mask+=' ';continue}if(c==='('){depth++;mask+=' ';continue}if(c===')'){depth--;mask+=' ';continue}mask+=depth?' ':c}return [...mask.matchAll(/\b(SELECT|FROM|(?:LEFT|RIGHT|INNER|CROSS)(?:\s+OUTER)?\s+JOIN|JOIN|WHERE|GROUP\s+BY|HAVING|ORDER\s+BY|LIMIT|SET)\b/gi)].map((m,i,all)=>({start:m.index,key:m[1].replace(/\s+/g,' ').toUpperCase(),text:text.slice(m.index,all[i+1]?.index||text.length).trim()}));}
function activeSQL(s){if(s.sql)return s.sql;if(s.stmt===null)return '';let source=scenario.statements[s.stmt].text;if(s.scope.includes('subquery'))source=source.match(/\((SELECT[\s\S]*?)\)/i)?.[1]||source;if(s.kind==='change')return source;const key=s.kind==='row'?'SET':stage(s).split(' · ')[0];return clauses(source).find(c=>c.key===key)?.text||s.title;}
function priorTable(t,index=current){const prev=steps[index-1];if(!prev)return null;return prev.tables.find(p=>p.name===t.name)||prev.tables.find(p=>JSON.stringify(p.cols)===JSON.stringify(t.cols))||prev.tables[0]||null;}
function previousRow(t,r,ri,index=current){const p=priorTable(t,index);if(!p||JSON.stringify(t.cols)!==JSON.stringify(p.cols))return null;let key=t.cols.findIndex(c=>c==='id'||c==='e.id');if(key<0&&t.cols.includes('dept'))key=t.cols.indexOf('dept');if(key>=0)return p.rows.find(x=>x.v[key]===r.v[key])||null;return p.rows[ri]||null;}
function freshCell(t,r,ri,ci){if(!r.old||!Object.prototype.hasOwnProperty.call(r.old,ci))return false;const prev=previousRow(t,r,ri);return !prev||prev.v[ci]!==r.v[ci];}
function rowStatus(t,r,ri){if(r.m==='changed')return Object.keys(r.old||{}).some(c=>freshCell(t,r,ri,+c))?'Changed now':steps[current].kind==='change'?'Updated':'Changed earlier';return labels[r.m]||'';}
function tag(t,r,ri){const label=rowStatus(t,r,ri);return label?`<span class="status-tag ${esc(r.m||'')}">${esc(label)}</span>`:'';}
function groupName(t,r){const groupCol=steps[current].title.replace(/^GROUP BY\s+/,'').trim();const ci=t.cols.indexOf(groupCol);return ci>=0?`${groupCol} = ${r.v[ci]===null?'NULL':r.v[ci]}`:`Group ${r.g}`;}
function cellHTML(t,r,ri,ci){const hasOld=r.old&&Object.prototype.hasOwnProperty.call(r.old,ci);return `${hasOld?`<del class="old" title="${freshCell(t,r,ri,ci)?'Value before this step':'Value before the UPDATE'}">${value(r.old[ci])}</del>`:''}<span class="value">${value(r.v[ci])}</span>`;}
function tableRows(t,ti){let html='',lastGroup=null;t.rows.forEach((r,ri)=>{if(r.g!=null&&lastGroup!==r.g){lastGroup=r.g;html+=`<tr class="group-label ${r.g%2===0?'even':''}"><td colspan="${t.cols.length+2}">${esc(groupName(t,r))} · ${t.rows.filter(x=>x.g===r.g).length} rows</td></tr>`}html+=`<tr data-row="${ri}" class="${esc(r.m||'')} ${r.g!=null?(r.g%2?'group-odd':'group-even'):''}"><td>${ri+1}</td>${t.cols.map((c,ci)=>`<td data-cell="${ti},${ri},${ci}"  class="${r.old&&Object.prototype.hasOwnProperty.call(r.old,ci)?'cell-change':''}">${MODE==='sheet'?`<button class="cell-button" aria-describedby="cell-detail" aria-label="${esc(c)}, row ${ri+1}: ${esc(r.v[ci]===null?'NULL':r.v[ci])}${r.old&&Object.prototype.hasOwnProperty.call(r.old,ci)?`; previously ${esc(r.old[ci]===null?'NULL':r.old[ci])}, ${freshCell(t,r,ri,ci)?'changed this step':'changed earlier'}`:''}${rowStatus(t,r,ri)?'. '+esc(rowStatus(t,r,ri)):''}">${cellHTML(t,r,ri,ci)}</button>`:cellHTML(t,r,ri,ci)}</td>`).join('')}<td class="status-cell">${tag(t,r,ri)}</td></tr>`});return html||`<tr><td colspan="${t.cols.length+2}">No rows at this stage.</td></tr>`;}
function legend(t){const marks=new Set(t.rows.map(r=>r.m));return `<div class="legend">${marks.has('current')?'<span><i class="swatch blue"></i>Updating this row</span>':''}${marks.has('match')?'<span><i class="swatch blue"></i>Matches WHERE</span>':''}${t.rows.some(r=>r.old)?'<span><i class="swatch"></i>Old value → new value</span>':''}${marks.has('dropped')||marks.has('removed')?'<span><i class="swatch red"></i>Excluded from the next stage</span>':''}${t.rows.some(r=>r.g!=null)?'<span><i class="swatch purple"></i>One band per group</span>':''}<span>NULL = no value</span></div>`;}
function tableHeader(t){const kept=t.rows.filter(r=>!excluded(r)).length;return `<div class="table-heading"><h3>${esc(t.name)}</h3>${t.badge?`<span class="status-tag changed">${esc(t.badge)}</span>`:''}<span class="row-count">${kept} ${t.more?'shown ':''}rows${kept!==t.rows.length?` · ${t.rows.length-kept} excluded`:''}</span></div>`;}
function tablesHTML(){return steps[current].tables.map((t,ti)=>`<section class="table-section">${tableHeader(t)}<div class="table-scroll"><table aria-label="${esc(t.name)}"><thead><tr><th scope="col">#</th>${t.cols.map(c=>`<th scope="col">${esc(c)}</th>`).join('')}<th scope="col">State</th></tr></thead><tbody>${tableRows(t,ti)}</tbody></table></div>${t.more?`<p class="more">${t.more} additional rows are not included in this preview.</p>`:''}${legend(t)}</section>`).join('')||'<p class="empty">No table output at this step.</p>';}
function deltaText(){const s=steps[current],prev=steps[current-1];if(!prev)return 'These tables are the baseline. Your SQL has not run yet.';if(s.scope.includes('subquery')&&!prev.scope.includes('subquery'))return 'The main SELECT pauses here. This nested query reads the source rows in its own scope.';if(!s.scope&&prev.scope.includes('subquery'))return 'Back in the main SELECT: the subquery’s values are now available to the CASE expression.';const rows=s.tables.flatMap(t=>t.rows),newChanges=[];s.tables.forEach(t=>t.rows.forEach((r,ri)=>Object.keys(r.old||{}).forEach(ci=>{if(freshCell(t,r,ri,+ci))newChanges.push(`${t.cols[ci]}: ${r.old[ci]===null?'NULL':r.old[ci]} → ${r.v[ci]===null?'NULL':r.v[ci]}`)})));if(newChanges.length)return `${newChanges.join('; ')}. Only this step’s new edits are counted here; earlier edits stay marked in the data.`;if(s.kind==='change')return 'All matching rows have been processed. This is the UPDATE summary; no additional rows change at this step.';const dropped=rows.filter(excluded).length;if(dropped)return `${dropped} ${dropped===1?'row does':'rows do'} not pass the condition. They remain visible for reference and will not enter the next stage.`;const matched=rows.filter(r=>r.m==='match').length;if(matched)return `${matched} rows match the WHERE condition. No values have changed yet.`;const groups=new Set(rows.filter(r=>r.g!=null).map(r=>r.g));if(groups.size)return `${rows.length} rows are arranged into ${groups.size} groups. The source values have not changed.`;if(/^HAVING/.test(s.title)){const n=rows.filter(r=>!excluded(r)).length;return `${n} groups pass the condition. Each displayed row now represents a group, rather than one source row.`}if(/^ORDER BY/.test(s.title)){const t=s.tables[0],p=priorTable(t);const changed=JSON.stringify(p?.rows.map(r=>r.v))!==JSON.stringify(t.rows.map(r=>r.v));return changed?'The row order changed. The values stay the same.':'The rows already satisfy this sort order. No values or positions changed.'}if(/^SELECT/.test(s.title))return `The output columns are now ${s.tables[0]?.cols.join(', ')||'empty'}. SELECT computes or selects values for each output row.`;if(/JOIN/.test(s.title))return 'Manager columns are attached to each employee row. A missing match leaves the manager columns NULL; the employee is retained.';if(/^WHERE/.test(s.title))return 'Every row passes this condition. No rows are filtered out.';if(/^FROM/.test(s.title))return s.stmt!==prev.stmt&&prev.stmt!==null?'The next statement starts from the updated table. Values changed by the UPDATE are already present.':'The source rows are now the query’s working data. No values have changed.';return s.explain;}
function renderSource(){const s=steps[current],fragment=activeSQL(s);$('source-content').innerHTML=codeStatements.map((stmt,i)=>{let code=esc(stmt.text);if(stmt.index===s.stmt&&fragment&&stmt.text.includes(fragment)){const at=s.scope.includes('subquery')?stmt.text.indexOf(fragment,stmt.text.search(/\(SELECT/i)):clauses(stmt.text).find(c=>c.text===fragment)?.start??stmt.text.indexOf(fragment);code=esc(stmt.text.slice(0,at))+`<mark>${esc(fragment)}</mark>`+esc(stmt.text.slice(at+fragment.length));}return `<div class="statement ${stmt.index===s.stmt?'active':''}"><span class="statement-label">Statement ${i+1}${stmt.index===s.stmt?' · active':''}</span><pre>${code}</pre></div>`}).join('');$('setup-code').textContent=scenario.setup;}
function updateShared(){const s=steps[current];$('scope').innerHTML=context(s);$('explain').textContent=s.explain;$('active-sql').textContent=activeSQL(s)||'Your setup has finished. The query starts on the next step.';$('delta').textContent=deltaText();$('jump').value=String(current);$('back').disabled=current===0;$('next').disabled=current===steps.length-1;$('step-count').textContent=`Step ${current+1} of ${steps.length}`;$('live').textContent=`Step ${current+1} of ${steps.length}. ${s.title}. ${s.scope||'Main statement'}. ${s.explain}`;renderSource();}
function go(index){const n=Math.max(0,Math.min(steps.length-1,index));if(n===current)return;current=n;render();}
$('scenario').textContent=scenario.name;
$('jump').innerHTML=steps.map((s,i)=>`<option value="${i}">${i+1}. ${esc(s.title)}${s.scope?` [${esc(s.scope)}]`:''}</option>`).join('');
$('jump').addEventListener('change',e=>go(+e.target.value));
$('back').addEventListener('click',()=>go(current-1));$('next').addEventListener('click',()=>go(current+1));
$('sql-toggle').addEventListener('click',()=>{const open=$('source').hidden;$('source').hidden=!open;$('sql-toggle').setAttribute('aria-expanded',String(open));$('sql-toggle').textContent=open?'Hide SQL':'View SQL';});
document.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey||e.shiftKey||e.target.closest('input,select,textarea,[contenteditable]'))return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();go(current+(e.key==='ArrowRight'?1:-1));}});


function card(t,r,ri){let titleIndex=t.cols.findIndex(c=>c==='name'||c==='e.name'||c==='employee');if(titleIndex<0)titleIndex=t.cols.findIndex(c=>c==='id'||c==='dept');const title=titleIndex<0?`Row ${ri+1}`:`${t.cols[titleIndex]}: ${r.v[titleIndex]===null?'NULL':r.v[titleIndex]}`;const joined=t.cols.some(c=>c.startsWith('m.'));function fields(indices){return '<dl>'+indices.map(ci=>`<dt>${esc(t.cols[ci])}</dt><dd class="${r.old&&Object.prototype.hasOwnProperty.call(r.old,ci)?'cell-change':''}">${cellHTML(t,r,ri,ci)}</dd>`).join('')+'</dl>'}const all=t.cols.map((_,i)=>i);const data=joined?`<div class="pair"><div><p>Employee · e</p>${fields(all.filter(i=>!t.cols[i].startsWith('m.')))}</div><div><p>Manager · m</p>${fields(all.filter(i=>t.cols[i].startsWith('m.')))}</div></div>`:fields(all);return `<article class="row-card ${esc(r.m||'')} ${joined?'joined':''}"><header><h3>${esc(title)}</h3>${tag(t,r,ri)}</header>${data}</article>`;}
function lanes(t){const rows=t.rows.map((r,ri)=>({r,ri})),groups=new Set(rows.filter(x=>x.r.g!=null).map(x=>x.r.g));if(groups.size)return [...groups].map(g=>({name:groupName(t,rows.find(x=>x.r.g===g).r),className:g%2?'group-odd':'group-even',items:rows.filter(x=>x.r.g===g)}));if(rows.some(x=>excluded(x.r)))return [{name:'Kept for the next stage',items:rows.filter(x=>!excluded(x.r))},{name:'Filtered out · stays here for reference',items:rows.filter(x=>excluded(x.r))}];if(rows.some(x=>x.r.m==='current')){const matched=steps.slice(0,current).reverse().find(s=>s.stmt===steps[current].stmt&&s.tables.some(tb=>tb.rows.some(r=>r.m==='match')));const mt=matched?.tables.find(tb=>tb.name===t.name);const id=t.cols.findIndex(c=>c==='id');const waiting=rows.filter(x=>!x.r.m&&id>=0&&mt?.rows.some(r=>r.m==='match'&&r.v[id]===x.r.v[id]));return [{name:'Updating now',items:rows.filter(x=>x.r.m==='current')},{name:'Already updated',items:rows.filter(x=>x.r.m==='changed')},{name:'Waiting for their turn',items:waiting},{name:'Outside this UPDATE',items:rows.filter(x=>!x.r.m&&!waiting.includes(x))}].filter(l=>l.items.length)}if(rows.some(x=>x.r.m==='match'))return [{name:'Matches WHERE · will be updated',items:rows.filter(x=>x.r.m==='match')},{name:'Does not match · unchanged',items:rows.filter(x=>x.r.m!=='match')}];return [{name:steps[current].kind==='result'?'Result rows':/^HAVING/.test(steps[current].title)?'One row per group':'Working rows',items:rows}];}
$('trail').innerHTML=steps.map((s,i)=>`<li class="${s.scope.includes('subquery')?'nested':''}"><button data-step="${i}" aria-label="Step ${i+1}: ${esc(s.title)}${s.scope?' · '+esc(s.scope):''}"><span class="trail-num">${i+1}</span><span class="trail-title">${esc(stage(s))}${s.scope?`<small>${esc(s.scope)}</small>`:''}</span></button></li>`).join('');$('trail').addEventListener('click',e=>{const b=e.target.closest('[data-step]');if(b)go(+b.dataset.step)});
function render(){updateShared();$('heading').textContent=friendly(steps[current]);document.querySelectorAll('[data-step]').forEach((b,i)=>{if(i===current)b.setAttribute('aria-current','step');else b.removeAttribute('aria-current');b.parentElement.classList.toggle('done',i<current)});const active=document.querySelector('[aria-current="step"]');if(active){const nav=active.closest('nav');const item=active.getBoundingClientRect(),bounds=nav.getBoundingClientRect();if(item.top<bounds.top)nav.scrollTop-=bounds.top-item.top+12;else if(item.bottom>bounds.bottom)nav.scrollTop+=item.bottom-bounds.bottom+12;}$('board').innerHTML=steps[current].tables.map(t=>`<section class="board-table"><h2>${esc(t.name)}${t.badge?` <span class="status-tag changed">${esc(t.badge)}</span>`:''}</h2>${lanes(t).map(l=>`<section class="lane ${l.className||''}"><h3 class="lane-head">${esc(l.name)} <span class="lane-count">${l.items.length} ${l.items.length===1?'row':'rows'}</span></h3><div class="card-grid">${l.items.map(x=>card(t,x.r,x.ri)).join('')||'<p class="empty">No rows.</p>'}</div></section>`).join('')}${t.more?`<p class="more">${t.more} additional rows are not included in this preview.</p>`:''}</section>`).join('')||'<p class="empty">No table output at this step.</p>';}

render();</script></body></html>
